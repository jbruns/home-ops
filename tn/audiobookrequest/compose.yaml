# AUDIOBOOKREQUEST STACK (deployed by doco-cd). Moved from asotbz/ops tn/asot-media (#457).
# Hostnames are under this Stack's own DOMAIN, not edge's.
services:
  audiobookrequest:
    # https://github.com/markbeep/AudioBookRequest/releases
    extends:
      file: ../_baseline.yaml
      service: baseline
    image: markbeep/audiobookrequest:1.10.7@sha256:7b7df351abece608fb84147dc43705f0eb1b350fc1427e0a7e5fea84a7852a19
    container_name: audiobookrequest
    user: ${BOOKS_UID}:${MEDIA_SHARED_GID}
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    deploy:
      resources:
        limits:
          # 30-day peak 151M
          memory: 256M
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "audiobookrequest_config"

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://abr.${DOMAIN}/api/health

      traefik.enable: true
      traefik.docker.network: proxy

      traefik.http.routers.audiobookrequest-http.rule: Host(`abr.${DOMAIN}`)
      traefik.http.routers.audiobookrequest-http.entrypoints: http
      traefik.http.routers.audiobookrequest-http.middlewares: redirect-https

      traefik.http.routers.audiobookrequest-https.rule: Host(`abr.${DOMAIN}`)
      traefik.http.routers.audiobookrequest-https.entrypoints: https
      traefik.http.routers.audiobookrequest-https.tls: true
      traefik.http.routers.audiobookrequest-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.audiobookrequest-https.service: audiobookrequest
      traefik.http.routers.audiobookrequest-https.middlewares: crowdsec-bouncer

      traefik.http.services.audiobookrequest.loadbalancer.server.port: 8000
    volumes:
      - audiobookrequest_config:/config
    networks:
      - default
      - proxy

volumes:
  # Created by the asot-media Stack; the explicit name keeps them across the move.
  audiobookrequest_config:
    name: asot-media_audiobookrequest_config
    external: true

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
