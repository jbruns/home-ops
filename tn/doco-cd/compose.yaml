# doco-cd deploys every Stack under tn/ from this repo (ADR-0001), including this one.
# Bootstrapped once by hand (see README); after that it replaces itself when this file changes.
services:
  doco-cd:
    # Pinned by digest: a self-updating deployer must never move on its own (Renovate bumps it).
    image: ghcr.io/kimdre/doco-cd:0.132.0@sha256:ed22583456c60c88c5cabdb47803aa0ab51284f00d70d5bb63fa56b223fa250a
    restart: unless-stopped
    dns_search: .
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          # 30-day peak 83M working set; generous, since an OOM-killed deployer stops every Deploy
          memory: 256M
    environment:
      TZ: ${TZ}
      SELF_UPDATE_ENABLED: "true"
      # applier, not scale_out: scale_out's successor polls and deploys while the
      # predecessor is still draining its in-flight deploys, so two deployers race
      # ("removal of container ... is already in progress") and leave <id>_name containers.
      SELF_UPDATE_STRATEGY: applier
      # REST API (e.g. POST /v1/api/project/<stack>/recreate?service=<svc>); no Traefik route,
      # reachable only on this Stack's networks, x-api-key required.
      API_SECRET_FILE: /run/secrets/api_secret
      SOPS_AGE_KEY_FILE: /run/secrets/sops_age_key
      APPRISE_API_URL: http://apprise:8000/notify
      APPRISE_NOTIFY_LEVEL: success
      APPRISE_NOTIFY_URLS_FILE: /run/secrets/apprise_urls
      POLL_CONFIG: |
        - url: https://github.com/jbruns/home-ops.git
          reference: main
          interval: 120
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "3"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
    secrets:
      - sops_age_key
      - apprise_urls
      - api_secret
    networks:
      - default
      # Prometheus scrapes doco_cd_* metrics on :9120.
      - metrics
    healthcheck:
      # The image's own check, declared so CI can see it (Baseline item: healthcheck).
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        tag: "{{.Name}}"

  # Relays doco-cd deploy notifications to Discord. doco-cd does not depend on it:
  # a failed notification never blocks a Deploy.
  apprise:
    image: caronc/apprise:2.0.2@sha256:6ae97e24b3447f85f725a03ba73c6dc3a5f4b99f4273ac126de2d9b5ed6205d5
    restart: unless-stopped
    dns_search: .
    # The image's apprise user; its startup script skips useradd/chown when not root, so no caps.
    user: "1000:100"
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          # 30-day peak 233M working set
          memory: 384M
    environment:
      TZ: ${TZ}
      APPRISE_WORKER_COUNT: 1
      APPRISE_STATEFUL_MODE: disabled
    # The image's VOLUME paths; stateless here (doco-cd sends the URLs with each /notify), so
    # tmpfs rather than anonymous volumes (Baseline item: anonymous-volumes).
    tmpfs:
      - /attach:uid=1000,gid=100,mode=0700
      - /config:uid=1000,gid=100,mode=0700
      - /plugin:uid=1000,gid=100,mode=0700
    labels:
      tier: info
      startup-order: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        tag: "{{.Name}}"

networks:
  # Owned by the monitoring Stack (ADR-0002).
  metrics:
    name: metrics
    external: true

volumes:
  data:
    name: doco-cd_data
    external: true

secrets:
  # Root-only on the Host (0400 in a 0700 dir); never in the repo.
  sops_age_key:
    file: /mnt/luna/homeops/age.key
  apprise_urls:
    file: ./apprise_urls.sops.txt
  api_secret:
    file: ./api_secret.sops.txt
