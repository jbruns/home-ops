# ROMM STACK (deployed by doco-cd)
# RomM, the Games Library's Media Server (ADR 0009), with its Datastores, whose containers are named romm-<service>
# (ADR 0010). Hostnames are under this Stack's own DOMAIN. See README.md for the IdP, first-run and Stage Select steps.
# Startup order: mariadb and valkey healthy, then romm.

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
  # Prometheus and exporters; owned by the monitoring Stack (ADR-0002).
  metrics:
    name: metrics
    external: true
  # stack-back and the Datastores it dumps; owned by the ops Stack.
  backup:
    name: backup
    external: true

include:
  - ./mariadb/service.yaml
  - ./valkey/service.yaml
  - ./romm/service.yaml
