services:
  nextpvr:
    # https://hub.docker.com/r/nextpvr/nextpvr_amd64
    # https://github.com/sub3/NextPVR/wiki/Install-Docker
    extends:
      file: ../_baseline.yaml
      service: baseline
    image: nextpvr/nextpvr_amd64:stable@sha256:79841be624d5719153ac7d2303c55fe671aa7d6feed3eaeb4020d5e418f00546
    container_name: nextpvr
    user: ${NEXTPVR_UID}:${MEDIA_SHARED_GID}
    deploy:
      resources:
        limits:
          # 30-day peak 1443M
          memory: 2304M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8866/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "nextpvr_config"

      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.nextpvr-http.rule: Host(`nextpvr.${DOMAIN}`)
      traefik.http.routers.nextpvr-http.entrypoints: http
      traefik.http.routers.nextpvr-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.nextpvr-https.rule: Host(`nextpvr.${DOMAIN}`)
      traefik.http.routers.nextpvr-https.entrypoints: https
      traefik.http.routers.nextpvr-https.tls: true
      traefik.http.routers.nextpvr-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.nextpvr-https.service: nextpvr
      traefik.http.routers.nextpvr-https.middlewares: crowdsec-bouncer

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://nextpvr.${DOMAIN}/

      traefik.http.services.nextpvr.loadbalancer.server.port: 8866
    volumes:
      - nextpvr_config:/config
      - nextpvr_buffer:/buffer
      # Media mounts never create their source (ADR 0009): a missing folder fails the Deploy
      # instead of becoming a root-owned empty folder.
      # Organizes only its recordings Library.
      - type: bind
        source: ${ZFS_POOL_ROOT_HDD}/media/nextpvr_recordings
        target: /recordings
        bind:
          create_host_path: false
    networks:
      - default
      - proxy

volumes:
  nextpvr_buffer:
    name: media_nextpvr_buffer
    external: true
  nextpvr_config:
    name: media_nextpvr_config
    external: true

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
