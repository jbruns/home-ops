# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  nextcloud:
    # https://hub.docker.com/_/nextcloud
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: nextcloud:33.0.8@sha256:9ed3924f92f651aab622b23557b3f3dbcf04f7678567f50a41dbace2463c0a52
    container_name: nextcloud
    # Run as the image's www-data instead of root-then-su, so no caps. The entrypoint supports this
    # (installs and upgrades rsync without --chown); /var/www/html must stay wholly www-data owned.
    user: "33:33"
    deploy:
      resources:
        limits:
          # 30-day peak 959M working set; PHP memory_limit is 1G per request
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/status.php | grep -q 'installed.:true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
      start_interval: 5s
    depends_on:
      mariadb:
        condition: service_healthy
        restart: true
      valkey:
        condition: service_healthy
        restart: true
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: critical
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "nextcloud_data"
      
      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.nextcloud-http.rule: Host(`nextcloud.${ALT_DOMAIN_HOME}`)
      traefik.http.routers.nextcloud-http.entrypoints: http
      traefik.http.routers.nextcloud-http.middlewares: redirect-https

      # Direct all https requests to the service with Nextcloud-specific middleware
      traefik.http.routers.nextcloud-https.rule: Host(`nextcloud.${ALT_DOMAIN_HOME}`)
      traefik.http.routers.nextcloud-https.entrypoints: https
      traefik.http.routers.nextcloud-https.tls: true
      traefik.http.routers.nextcloud-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.nextcloud-https.service: nextcloud
      traefik.http.routers.nextcloud-https.middlewares: nextcloud-chain

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://nextcloud.${ALT_DOMAIN_HOME}/status.php

      # Middleware for Nextcloud-specific headers
      traefik.http.middlewares.nextcloud-headers.headers.hostsProxyHeaders: X-Forwarded-Host
      traefik.http.middlewares.nextcloud-headers.headers.referrerPolicy: same-origin
      traefik.http.middlewares.nextcloud-headers.headers.stsSeconds: 31536000
      traefik.http.middlewares.nextcloud-headers.headers.stsIncludeSubdomains: true
      traefik.http.middlewares.nextcloud-headers.headers.stsPreload: true
      traefik.http.middlewares.nextcloud-headers.headers.contentTypeNosniff: true
      traefik.http.middlewares.nextcloud-headers.headers.customResponseHeaders.X-Robots-Tag: 'noindex,nofollow'

      # Middleware for service discovery (https://docs.nextcloud.com/server/latest/admin_manual/configuration_server/reverse_proxy_configuration.html#service-discovery)
      traefik.http.middlewares.nextcloud-redirectregex.redirectregex.permanent: true
      traefik.http.middlewares.nextcloud-redirectregex.redirectregex.regex: 'https://(.*)/.well-known/(?:card|cal)dav'
      traefik.http.middlewares.nextcloud-redirectregex.redirectregex.replacement: 'https://$${1}/remote.php/dav'

      # Chain all Nextcloud middlewares together
      traefik.http.middlewares.nextcloud-chain.chain.middlewares: crowdsec-bouncer, nextcloud-headers, nextcloud-redirectregex

      traefik.http.services.nextcloud.loadbalancer.server.port: 80
    volumes:
      - nextcloud_data:/var/www/html
      - ./php-limits.ini:/usr/local/etc/php/conf.d/php-limits.ini:ro
    networks:
      - default
      - proxy

  nextcloud-cron:
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: nextcloud:33.0.8@sha256:9ed3924f92f651aab622b23557b3f3dbcf04f7678567f50a41dbace2463c0a52
    container_name: nextcloud-cron
    # The image's /cron.sh is busybox crond, which needs root to switch to www-data. Run the same
    # job (*/5 php -f cron.php) as www-data in a loop instead, so no caps; the marker file gives the
    # healthcheck something to check.
    user: "33:33"
    init: true
    deploy:
      resources:
        limits:
          # 30-day peak 266M working set; above PHP memory_limit (1G) so a job hits PHP's limit, not an OOM kill
          memory: 1280M
    depends_on:
      mariadb:
        condition: service_healthy
        restart: true
      valkey:
        condition: service_healthy
        restart: true
      nextcloud:
        condition: service_healthy
    # solely for Nextcloud cron job
    entrypoint: ["sh", "-c", "while :; do php -f /var/www/html/cron.php && touch /tmp/cron-ok; sleep 300; done"]
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/cron-ok -mmin -15 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 300s
      start_interval: 10s
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
    volumes:
      - nextcloud_data:/var/www/html
      - ./php-limits.ini:/usr/local/etc/php/conf.d/php-limits.ini:ro
    networks:
      - default

volumes:
  nextcloud_data:
    name: home_nextcloud_data
    external: true
