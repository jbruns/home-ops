# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  mariadb:
    # https://hub.docker.com/_/mariadb
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: mariadb:11.8.9@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
    container_name: mariadb
    # The image's mysql user; the entrypoint skips its chown + gosu when not root, so no caps.
    user: "999:999"
    deploy:
      resources:
        limits:
          # 30-day peak 372M working set
          memory: 768M
    stop_grace_period: 60s
    # Exit 0 whenever the server answers, even "access denied"; no credentials needed.
    healthcheck:
      # The image's check, via its healthcheck user (.my-healthcheck.cnf in the datadir). mariadb-admin
      # ping passed even on "Access denied", logging a warning every 30s.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      # https://mariadb.com/kb/en/mariadb-server-docker-official-image-environment-variables/
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/mariadb_root_password
    # MARIADB_USER/PASSWORD: the read-only account stack-back dumps with.
    env_file:
      - ./backup_cred.sops.env
    secrets:
      - mariadb_root_password
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: critical
      startup-order: "1"
      stack-back.mariadb: true

    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - default
      # stack-back (ops) dumps the databases over the backup network.
      - backup

  mariadb-exporter:
    # https://github.com/prometheus/mysqld_exporter
    # Its `exporter` account was created by hand, once (a fresh data volume needs it again):
    #   CREATE USER 'exporter'@'%' IDENTIFIED BY '<MARIADB_EXPORTER_PASSWORD>' WITH MAX_USER_CONNECTIONS 3;
    #   GRANT PROCESS, SLAVE MONITOR ON *.* TO 'exporter'@'%';
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: prom/mysqld-exporter:v0.20.0@sha256:abed8dac117b4ae5b70757f988e44795935b9a72c3b58d720c67ba688f8cb79e
    container_name: mariadb-exporter
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9104/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    deploy:
      resources:
        limits:
          # 30-day peak 35M working set
          memory: 64M
    command:
      - --mysqld.address=mariadb:3306
      - --mysqld.username=exporter
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${MARIADB_EXPORTER_PASSWORD}
    depends_on:
      mariadb:
        condition: service_healthy
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: info
      startup-order: "3"

    networks:
      - default
      - metrics

secrets:
  mariadb_root_password:
    file: ./mariadb_root_password.sops.txt

volumes:
  mariadb_data:
    name: home_mariadb_data
    external: true
