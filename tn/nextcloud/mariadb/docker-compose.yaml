services:
  mariadb:
    # https://hub.docker.com/_/mariadb
    image: mariadb:11.8.9
    container_name: mariadb
    restart: unless-stopped
    stop_grace_period: 60s
    dns_search: .
    # Exit 0 whenever the server answers, even "access denied"; no credentials needed.
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      # https://mariadb.com/kb/en/mariadb-server-docker-official-image-environment-variables/
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/mariadb_root_password
    # MARIADB_USER/PASSWORD: the read-only account stack-back dumps with.
    env_file:
      - ./backup_cred.sops.env
    secrets:
      - mariadb_root_password
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: critical
      startup-order: "1"
      stack-back.mariadb: true

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        tag: "{{.Name}}"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - default
      # stack-back (ops) dumps the databases over the backup network.
      - backup

  mariadb-exporter:
    # https://github.com/prometheus/mysqld_exporter
    # Its `exporter` account was created by hand, once (a fresh data volume needs it again):
    #   CREATE USER 'exporter'@'%' IDENTIFIED BY '<MARIADB_EXPORTER_PASSWORD>' WITH MAX_USER_CONNECTIONS 3;
    #   GRANT PROCESS, SLAVE MONITOR ON *.* TO 'exporter'@'%';
    image: prom/mysqld-exporter:v0.20.0
    container_name: mariadb-exporter
    restart: unless-stopped
    dns_search: .
    security_opt:
      - no-new-privileges=true
    command:
      - --mysqld.address=mariadb:3306
      - --mysqld.username=exporter
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${MARIADB_EXPORTER_PASSWORD}
    depends_on:
      mariadb:
        condition: service_healthy
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: info
      startup-order: "3"

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        tag: "{{.Name}}"
    networks:
      - default
      - metrics

secrets:
  mariadb_root_password:
    file: ./mariadb_root_password.sops.txt

volumes:
  mariadb_data:
    name: home_mariadb_data
    external: true
