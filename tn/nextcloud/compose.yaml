# NEXTCLOUD STACK (deployed by doco-cd)
# Nextcloud with its Datastores. Startup order: mariadb and valkey healthy, then nextcloud and cron.

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
  # Prometheus and exporters; owned by the monitoring Stack (ADR-0002).
  metrics:
    name: metrics
    external: true
  # stack-back and the Datastores it dumps; owned by the ops Stack.
  backup:
    name: backup
    external: true

include:
  - ./mariadb/docker-compose.yaml
  - ./valkey/docker-compose.yaml
  - ./nextcloud/docker-compose.yaml
