configs:
  valkey_conf:
    content: |
      requirepass ${REDIS_PASSWORD}
      save ""
      appendonly no
      loglevel warning
  redis_exporter_password:
    content: |
      {"redis://valkey:6379": "${REDIS_PASSWORD}"}

services:
  # Nextcloud's memcache and file locking. Nothing here needs to survive a restart, so no persistence.
  valkey:
    # https://hub.docker.com/r/valkey/valkey
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    container_name: valkey
    # The image's valkey user; the entrypoint skips its chown + su-exec when not root, so no caps.
    user: "999:1000"
    deploy:
      resources:
        limits:
          # 30-day peak 23M working set
          memory: 64M
    # The password lives in a config file, never in process arguments or the environment (#496).
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    configs:
      - source: valkey_conf
        target: /etc/valkey/valkey.conf
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(sed -n 's/^requirepass //p' /etc/valkey/valkey.conf)\" valkey-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: critical
      startup-order: "1"

    networks:
      - default

  redis-exporter:
    # https://github.com/oliver006/redis_exporter
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: oliver006/redis_exporter:v1.90.0@sha256:a129504e65b87c54f79bc92f1afc403475e8ff646a3d7512de469904ceddf986
    container_name: redis-exporter
    user: ${HOME_UID}:${HOME_GID}
    deploy:
      resources:
        limits:
          # 30-day peak 33M working set
          memory: 64M
    environment:
      - REDIS_ADDR=redis://valkey:6379
      - REDIS_PASSWORD_FILE=/run/redis-password.json
    configs:
      - source: redis_exporter_password
        target: /run/redis-password.json
    depends_on:
      valkey:
        condition: service_healthy
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: info
      startup-order: "3"
      baseline.exempt.healthcheck: "scratch image: no shell, wget or health subcommand"

    networks:
      - default
      - metrics
