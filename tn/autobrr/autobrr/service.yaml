# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  autobrr:
    # https://github.com/autobrr/autobrr/pkgs/container/autobrr
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: ghcr.io/autobrr/autobrr:v1.85@sha256:f7594d15dfe9a59e7bbc4bce8aee437a1d440d60b350e2ee74331c0d4ec01928
    container_name: autobrr
    user: ${AUTOBRR_UID}:${MEDIA_SHARED_GID}
    deploy:
      resources:
        limits:
          # 30-day peak 109M working set
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7474/api/healthz/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      # https://autobrr.com/installation/docker#environment-variables
      - TZ=${TZ}
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "autobrr_config"
      
      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.autobrr-http.rule: Host(`autobrr.${DOMAIN}`)
      traefik.http.routers.autobrr-http.entrypoints: http
      traefik.http.routers.autobrr-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.autobrr-https.rule: Host(`autobrr.${DOMAIN}`)
      traefik.http.routers.autobrr-https.entrypoints: https
      traefik.http.routers.autobrr-https.tls: true
      traefik.http.routers.autobrr-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.autobrr-https.service: autobrr
      traefik.http.routers.autobrr-https.middlewares: crowdsec-bouncer

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://autobrr.${DOMAIN}/api/healthz/liveness

      traefik.http.services.autobrr.loadbalancer.server.port: 7474
    volumes:
      - autobrr_config:/config
    networks:
      - default
      - downloads
      - proxy

volumes:
  autobrr_config:
    name: autobrr_config
    external: true