# CALIBRE-WEB-AUTOMATED STACK (deployed by doco-cd). Moved from a sibling deployment repo (#457).
# Hostnames are under this Stack's own DOMAIN, not edge's.
services:
  calibre-web-automated:
    # https://github.com/crocodilestick/Calibre-Web-Automated/releases
    extends:
      file: ../_baseline.yaml
      service: baseline
    image: crocodilestick/calibre-web-automated:v4.0.8@sha256:5e00373854247750cc3e4479b492ae09293ff5e06ed10177f226634d97888679
    container_name: calibre-web-automated
    # Starts as root, then drops to the PUID/UID user: chown, switch user, signal its child.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8083/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 5s
    deploy:
      resources:
        limits:
          # 30-day peak 293M
          memory: 512M
    environment:
      - PUID=${CWA_UID}
      - PGID=${MEDIA_SHARED_GID}
      - TZ=${TZ}
    # HARDCOVER_TOKEN: the same Hardcover API key as Shelfmark's HARDCOVER_API_KEY. CWA uses it for
    # the Hardcover metadata provider in the editor; cwa-ingest-gate below uses it too.
    # Settings live in cwa.db (Admin -> CWA Settings): Hardcover ID auto-fetch OFF and metadata fetch on
    # ingest OFF, so cwa-ingest-gate is the only automated metadata writer (ADR 0017). Fetch on ingest
    # searches title plus authors, for which Hardcover ranks summaries and omnibuses first, and applies
    # the first result unchecked (0 of 5 test titles right; the editor's title-only search got 5 of 5), so
    # it would overwrite series, date, rating, identifiers, tags and description from another book.
    # Auto-fetch would write a hardcover-id before the gate has checked the match.
    # Ingest (cwa.db, ADR 0016: one Format per Book, EPUB first): auto-convert ON with target EPUB, the
    # safety net for whatever an admin uploads; auto-convert ignores cbz,cbr,pdf, so a PDF stays a PDF;
    # auto-ingest ignores docx,html,htmlz,rtf,cbz,cbr (comics are not Books); retained formats epub
    # only (no original kept beside its conversion); automerge new_record. Every automerge mode still adds a
    # file to a Book whose title and authors match when that Book lacks the file's Format; only a duplicate
    # Format becomes a new record. cwa-ingest-gate folds new records by Hardcover ID and trims a Book that
    # gained a Format back to its best file (#779).
    # Roles (app.db, Admin -> Users; ADR 0017: only admins edit): exactly two admins, both from the
    # cwa-admins IdP group. Every other user, and the default role for new users, is download, Send
    # to Kindle (needs download), edit shelves and change password (role 338): no upload, edit or delete.
    env_file: ./calibre-web-automated.sops.env
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "calibre-web-automated_config"

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://cwa.${DOMAIN}/health
      # Native OIDC: CWA's own login path answers with the redirect to the IdP
      probe.idp_url: https://cwa.${DOMAIN}/login/generic
      probe.idp_auth: oidc

      traefik.enable: true
      traefik.docker.network: proxy

      traefik.http.routers.calibre-web-automated-http.rule: Host(`cwa.${DOMAIN}`)
      traefik.http.routers.calibre-web-automated-http.entrypoints: http
      traefik.http.routers.calibre-web-automated-http.middlewares: redirect-https

      # Security. Protected by native OIDC (ADR 0006): the web UI signs in at the IdP itself, so no
      # forward auth and no Client Path. OPDS readers can't sign in at the IdP; /opds takes HTTP basic
      # auth against CWA's local passwords, which ignore the disabled standard login. A user who needs
      # OPDS sets a local password in their CWA profile; CrowdSec alone guards those guesses, as for
      # Audiobookshelf. /health is public.
      # Settings live in app.db, not env (Admin -> Basic Configuration; secrets only there):
      #   Login type OAuth; generic provider, metadata URL
      #   https://idp.<domain>/application/o/cwa/.well-known/openid-configuration, scopes openid profile email,
      #   username mapper preferred_username, email mapper email, admin group cwa-admins (group admin
      #   management on: membership grants and revokes admin at each sign-in); OAuth Redirect Host
      #   https://cwa.<domain>; reverse-proxy header login OFF (with no forward auth, a client could
      #   send the header itself); standard login disabled; session protection Basic (Strong binds a
      #   session to the client IP, which CWA sees as Cloudflare's edge IP; it changes between
      #   requests and signs the user out; TRUSTED_PROXY_COUNT=2 would also drop X-Forwarded-Proto).
      # Account linking: each sign-in picks the CWA user whose name equals preferred_username exactly
      # (case-sensitive), else whose email matches, else creates one, and repoints the IdP subject's
      # flask_dance_oauth row at it. The subject is not used to find the user, so renaming someone
      # at the IdP gives them a new, empty CWA account: rename the CWA user to match first. There is
      # no local break-glass admin: every user comes from the IdP.
      # Locked out: keep cwa.<domain> off the internet, then in /config/app.db set settings
      # config_disable_standard_login=0 and config_login_type=0, restart, and set a local password on
      # the Operator's own user with python3 /app/calibre-web-automated/cps.py -p /config/app.db -s <user>:<pass>.
      traefik.http.routers.calibre-web-automated-https.rule: Host(`cwa.${DOMAIN}`)
      traefik.http.routers.calibre-web-automated-https.entrypoints: https
      traefik.http.routers.calibre-web-automated-https.tls: true
      traefik.http.routers.calibre-web-automated-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.calibre-web-automated-https.service: calibre-web-automated
      traefik.http.routers.calibre-web-automated-https.middlewares: crowdsec-bouncer

      traefik.http.services.calibre-web-automated.loadbalancer.server.port: 8083
    volumes:
      - calibre-web-automated_config:/config
      # Media mounts never create their source (ADR 0009): a missing folder fails the Deploy
      # instead of becoming a root-owned empty folder.
      # Books Organizer: its Ingest Folder and the Books Library. calibre imports by copying, so the
      # two separate mounts cost nothing (ADR 0009).
      - type: bind
        source: ${ZFS_POOL_ROOT_HDD}/media/books/ingest
        target: /cwa-book-ingest
        bind:
          create_host_path: false
      - type: bind
        source: ${ZFS_POOL_ROOT_HDD}/media/books/library
        target: /calibre-library
        bind:
          create_host_path: false
    networks:
      - default
      - proxy

  cwa-ingest-gate:
    # Checks each Book CWA adds: rejects comics and non-English Books, matches the rest on Hardcover and
    # writes their metadata, folds a second copy into the Book that holds its Hardcover ID, and tags
    # what it can't decide `review` (ADR 0016, ADR 0017). A Custom Component (ADR 0008).
    # Source: components/cwa-ingest-gate in the Repo Tooling repo; keep its CWA pin equal to the one above.
    extends:
      file: ../_baseline.yaml
      service: baseline
    image: ghcr.io/jbruns/cwa-ingest-gate:0.2.0@sha256:7a9e21ec57901937cac58a53682b6f46121774f3f98220e65e46484010e37dc8
    container_name: cwa-ingest-gate
    # The Library's owner, as CWA drops to: calibredb writes metadata.db and the Book folders.
    user: ${CWA_UID}:${MEDIA_SHARED_GID}
    deploy:
      resources:
        limits:
          # Unmeasured. CWA runs the same calibredb plus conversions and peaked at 293M in 30 days; the
          # /tmp tmpfs counts against this too.
          memory: 768M
          # One core, so a batch of embeds never crowds CWA or the Host.
          cpus: "1"
    read_only: true
    # /tmp: calibredb's settings, and each write's temporary copy of the Book's metadata and cover.
    # /cwa-book-ingest: a VOLUME of the CWA base image the gate never uses; tmpfs rather than an
    # anonymous volume (Baseline item: anonymous-volumes).
    tmpfs:
      - /tmp:size=256m
      - /cwa-book-ingest:size=1m,mode=0555
    depends_on:
      calibre-web-automated:
        condition: service_healthy
    # Probes the gate's own /healthz, never Hardcover or the Library: a failing run shows as
    # BooksIngestGateStalled, not as this container going unhealthy.
    healthcheck:
      test: ["CMD", "/lsiopy/bin/python3", "-m", "cwa_ingest_gate", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    # HARDCOVER_TOKEN. Every other setting is the image default: a run every 300s, Books settled for
    # 120s, title and author score at least 0.85, metrics on 9715.
    env_file: ./calibre-web-automated.sops.env
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "3"
    volumes:
      - type: bind
        source: ${ZFS_POOL_ROOT_HDD}/media/books/library
        target: /calibre-library
        bind:
          create_host_path: false
      # The mark: the highest Book id checked so far.
      - cwa-ingest-gate_state:/state
      # tags.json (the controlled tag list and its synonyms) and author-overrides.json, over the base
      # image's /config VOLUME.
      - ./cwa-ingest-gate:/config:ro
    networks:
      - default
      - metrics

volumes:
  # Created by the asot-media Stack; the explicit name keeps them across the move.
  calibre-web-automated_config:
    name: calibre-web-automated_config
    external: true
  # Lost, the gate's next run sets the mark to the newest Book again: only Books added since its last
  # run go unchecked.
  cwa-ingest-gate_state:
    name: calibre-web-automated_cwa-ingest-gate_state
    labels:
      homeops.regenerable: "the gate's first run sets the mark again"

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
  # Prometheus and exporters; owned by the monitoring Stack (ADR-0002).
  metrics:
    name: metrics
    external: true
