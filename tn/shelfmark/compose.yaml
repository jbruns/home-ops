# SHELFMARK STACK (deployed by doco-cd). Moved from asotbz/ops tn/asot-media (#457).
# Hostnames are under this Stack's own DOMAIN, not edge's.
services:
  shelfmark:
    # https://github.com/calibrain/shelfmark/releases
    extends:
      file: ../_baseline.yaml
      service: baseline
    image: ghcr.io/calibrain/shelfmark:v1.4.0@sha256:4ef757349c3c7a7d90ba95b1e2a46ce4dd460a4776efbcf2aa1b1c476e7d5de5
    container_name: shelfmark
    # Starts as root, then drops to the PUID/UID user: chown, switch user, signal its child.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8084/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 5s
    deploy:
      resources:
        limits:
          # 30-day peak 796M
          memory: 1200M
    environment:
      - UID=${BOOKS_UID}
      - GID=${MEDIA_SHARED_GID}
      - TZ=${TZ}
      - AA_DONATOR_KEY=${AA_DONATOR_KEY}
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "cwa-downloader_config"

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://cwd.${DOMAIN}/api/health
      probe.idp_url: https://cwd.${DOMAIN}/

      traefik.enable: true
      traefik.docker.network: proxy

      traefik.http.routers.shelfmark-http.rule: Host(`cwd.${DOMAIN}`)
      traefik.http.routers.shelfmark-http.entrypoints: http
      traefik.http.routers.shelfmark-http.middlewares: redirect-https

      # The web UI is Protected: crowdsec-bouncer, then the IdP (ADR 0006)
      traefik.http.routers.shelfmark-https.rule: Host(`cwd.${DOMAIN}`)
      traefik.http.routers.shelfmark-https.entrypoints: https
      traefik.http.routers.shelfmark-https.tls: true
      traefik.http.routers.shelfmark-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.shelfmark-https.service: shelfmark
      traefik.http.routers.shelfmark-https.middlewares: protected

      # The Probe's path, without the IdP
      traefik.http.routers.shelfmark-health.rule: Host(`cwd.${DOMAIN}`) && Path(`/api/health`)
      traefik.http.routers.shelfmark-health.entrypoints: https
      traefik.http.routers.shelfmark-health.tls: true
      traefik.http.routers.shelfmark-health.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.shelfmark-health.service: shelfmark
      traefik.http.routers.shelfmark-health.middlewares: crowdsec-bouncer

      traefik.http.services.shelfmark.loadbalancer.server.port: 8084
    volumes:
      - cwa-downloader_config:/config
      - ${ZFS_POOL_ROOT_HDD}/media/cwa-book-ingest:/cwa-book-ingest
      - ${ZFS_POOL_ROOT_HDD}/media/audiobooks:/audiobooks
      - ${ZFS_POOL_ROOT_HDD}/media/tordl/cwd-books:/data/tordl/cwd-books
      - ${ZFS_POOL_ROOT_HDD}/media/tordl/cwd-audiobooks:/data/tordl/cwd-audiobooks
      - ${ZFS_POOL_ROOT_HDD}/media/nzbdl/completed/Books:/data/nzbdl/completed/Books
      - ${ZFS_POOL_ROOT_HDD}/media/nzbdl/completed/Audiobooks:/data/nzbdl/completed/Audiobooks
    networks:
      - default
      - proxy

volumes:
  # Created by the asot-media Stack; the explicit name keeps them across the move.
  cwa-downloader_config:
    name: asot-media_cwa-downloader_config
    external: true

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
