# SHELFMARK STACK (deployed by doco-cd). Moved from asotbz/ops tn/asot-media (#457).
# Hostnames are under this Stack's own DOMAIN; DOWNLOADER_DOMAIN is the qbittorrent and sabnzbd Stacks'.
services:
  shelfmark:
    # https://github.com/calibrain/shelfmark/releases
    extends:
      file: ../_baseline.yaml
      service: baseline
    image: ghcr.io/calibrain/shelfmark:v1.4.0@sha256:4ef757349c3c7a7d90ba95b1e2a46ce4dd460a4776efbcf2aa1b1c476e7d5de5
    container_name: shelfmark
    # Started as the data's owner, the entrypoint takes its non-root path (no chown, no gosu), so
    # no caps. That path needs a writable TMP_DIR and no entrypoint log under /var/log.
    user: ${SHELFMARK_UID}:${MEDIA_SHARED_GID}
    tmpfs:
      - /tmp/shelfmark:uid=${SHELFMARK_UID},gid=${MEDIA_SHARED_GID},mode=0700
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8084/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 5s
    deploy:
      resources:
        limits:
          # 30-day peak 796M
          memory: 1200M
    # Admin settings are declared here: a setting set by environment is locked in the UI. Only values
    # that differ from upstream's defaults are pinned; secrets (API keys, Downloader logins, the OIDC
    # client) are in shelfmark.sops.env. Mirror lists and cache tunables stay upstream-maintained; path
    # mappings and request rules can't be set by environment and stay in the UI.
    # https://github.com/calibrain/shelfmark/blob/v1.4.0/docs/environment-variables.md
    environment:
      - ENABLE_LOGGING=false
      - TZ=${TZ}
      # Security. Protected by native OIDC (ADR 0006): Shelfmark is a Requester for other users, so each needs
      # their own identity. Admin comes from the IdP group; no local login, so no password to guess.
      # The discovery URL, client ID and secret are in shelfmark.sops.env. Locked out: deploy once
      # with AUTH_METHOD=none and the UI kept off the internet, fix, then revert.
      # https://github.com/calibrain/shelfmark/blob/v1.4.0/docs/oidc.md
      - AUTH_METHOD=oidc
      - OIDC_ADMIN_GROUP=shelfmark-admins
      - OIDC_AUTO_REDIRECT=true
      - DISABLE_LOCAL_AUTH=true
      # Search and metadata
      - SEARCH_PAGE_TITLE=Book Search & Download
      - METADATA_PROVIDER=hardcover
      - HARDCOVER_ENABLED=true
      - CALIBRE_WEB_URL=https://cwa.${DOMAIN}
      - AUDIOBOOK_LIBRARY_URL=https://abs.${DOMAIN}
      # Books Requester: into CWA's Ingest Folder (INGEST_DIR is the Destination setting's env name).
      - INGEST_DIR=/cwa-book-ingest
      # Organizer for Audiobooks (ADR 0009): a folder per book, as Audiobookshelf needs outside the
      # Library root; {Author}/{Title} alone merges an author's books into one item.
      - DESTINATION_AUDIOBOOK=/data/audiobooks/library
      - FILE_ORGANIZATION_AUDIOBOOK=organize
      - TEMPLATE_AUDIOBOOK_ORGANIZE={Author}/{Title}/{Title}
      # Copy, never hardlink, from torrents/: a hardlink would leave the seeding Downloader a writable
      # link to the Library file; on ZFS the copy should be a block clone. Books never hardlink into the Ingest Folder.
      - HARDLINK_TORRENTS_AUDIOBOOK=false
      - HARDLINK_TORRENTS=false
      # Requester sources: Anna's Archive direct download (donator key) and Prowlarr
      - DIRECT_DOWNLOAD_ENABLED=true
      - PROWLARR_ENABLED=true
      - PROWLARR_URL=https://plr.${DOMAIN}
      # Downloaders: their own Stacks' hostnames; categories keep Shelfmark's downloads apart from the *arrs'.
      - PROWLARR_TORRENT_CLIENT=qbittorrent
      - QBITTORRENT_URL=https://qbittorrent.${DOWNLOADER_DOMAIN}
      - QBITTORRENT_CATEGORY=cwd-books
      - QBITTORRENT_CATEGORY_AUDIOBOOK=cwd-audiobooks
      - PROWLARR_USENET_CLIENT=sabnzbd
      - SABNZBD_URL=https://sabnzbd.${DOWNLOADER_DOMAIN}
      - SABNZBD_CATEGORY_AUDIOBOOK=audiobooks
    env_file: ./shelfmark.sops.env
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "cwa-downloader_config"

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://cwd.${DOMAIN}/api/health
      # Native OIDC: Shelfmark's own login path answers with the redirect to the IdP
      probe.idp_url: https://cwd.${DOMAIN}/api/auth/oidc/login
      probe.idp_auth: oidc

      traefik.enable: true
      traefik.docker.network: proxy

      traefik.http.routers.shelfmark-http.rule: Host(`cwd.${DOMAIN}`)
      traefik.http.routers.shelfmark-http.entrypoints: http
      traefik.http.routers.shelfmark-http.middlewares: redirect-https

      # The web UI signs in at the IdP itself (native OIDC), so no forward auth; /api/health is public
      traefik.http.routers.shelfmark-https.rule: Host(`cwd.${DOMAIN}`)
      traefik.http.routers.shelfmark-https.entrypoints: https
      traefik.http.routers.shelfmark-https.tls: true
      traefik.http.routers.shelfmark-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.shelfmark-https.service: shelfmark
      traefik.http.routers.shelfmark-https.middlewares: crowdsec-bouncer

      traefik.http.services.shelfmark.loadbalancer.server.port: 8084
    volumes:
      - cwa-downloader_config:/config
      # Media mounts never create their source (ADR 0009): a missing folder fails the Deploy
      # instead of becoming a root-owned empty folder.
      # Audiobooks Organizer: the whole Audiobooks tree as one mount, so imports from usenet/ are
      # renames. Paths match the Downloaders' (/data/audiobooks/{usenet,torrents}): no path mapping.
      - type: bind
        source: ${ZFS_POOL_ROOT_HDD}/media/audiobooks
        target: /data/audiobooks
        bind:
          create_host_path: false
      # Books Requester: the Downloaders' books folders and CWA's Ingest Folder, never the Books Library.
      - type: bind
        source: ${ZFS_POOL_ROOT_HDD}/media/books/ingest
        target: /cwa-book-ingest
        bind:
          create_host_path: false
      - type: bind
        source: ${ZFS_POOL_ROOT_HDD}/media/books/usenet
        target: /data/books/usenet
        bind:
          create_host_path: false
      - type: bind
        source: ${ZFS_POOL_ROOT_HDD}/media/books/torrents
        target: /data/books/torrents
        bind:
          create_host_path: false
    networks:
      - default
      - proxy

volumes:
  # Created by the asot-media Stack; the explicit name keeps them across the move.
  cwa-downloader_config:
    name: asot-media_cwa-downloader_config
    external: true

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
