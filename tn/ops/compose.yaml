# OPS STACK (deployed by doco-cd)
# Host-wide tooling: stack-back (volume and database backups) and device-backups (carries the Device
# Backup datasets into them).

networks:
  # stack-back and the databases it dumps; owned here (ADR-0002).
  backup:
    name: backup
    driver: bridge

include:
  - ./stack-back/service.yaml
  - ./device-backups/service.yaml
