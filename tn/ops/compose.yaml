# OPS STACK (deployed by doco-cd)
# Host-wide tooling: stack-back (volume and database backups) and Portainer (viewer here;
# still deploys asotbz/ops Stacks to this and other hosts).

networks:
  # stack-back and the databases it dumps; owned here (ADR-0002).
  backup:
    name: backup
    driver: bridge
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
  # Legacy flat network, kept until the databases have moved to backup.
  backend:
    name: common_backend
    external: true

include:
  - ./portainer/docker-compose.yaml
  - ./stack-back/docker-compose.yaml
