services:
  portainer:
    image: portainer/portainer-ee:2.45.2
    container_name: portainer
    user: ${COMMON_UID}:${COMMON_GID}
    group_add:
      - ${DOCKER_GID}
    security_opt:
      - no-new-privileges=true
    restart: unless-stopped
    dns_search: .
    environment:
      # https://github.com/orgs/portainer/discussions/9755#discussioncomment-8804428
      - COMPOSE_UNPACKER_IMAGE=ghcr.io/jbruns/compose-unpacker:2.45.0-sops.1
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: info
      startup-order: "3"
      stack-back.volumes: true
      stack-back.volumes.include: "portainer_data"

      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.portainer-http.rule: Host(`pio.${DOMAIN}`)
      traefik.http.routers.portainer-http.entrypoints: http
      traefik.http.routers.portainer-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.portainer-https.rule: Host(`pio.${DOMAIN}`)
      traefik.http.routers.portainer-https.entrypoints: https
      traefik.http.routers.portainer-https.tls: true
      traefik.http.routers.portainer-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.portainer-https.service: portainer
      traefik.http.routers.portainer-https.middlewares: crowdsec-bouncer

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://pio.${DOMAIN}/api/system/status

      traefik.http.services.portainer.loadbalancer.server.port: 9000
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 1
        tag: "{{.Name}}"
    ports:
      # fallback internal
      - 9443:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - default
      - proxy

volumes:
  portainer_data:
    name: common_portainer_data
    external: true
