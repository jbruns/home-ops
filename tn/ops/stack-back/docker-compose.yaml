services:
  stack-back:
    # https://github.com/lawndoc/stack-back
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: ghcr.io/lawndoc/stack-back:v1.5.4@sha256:adb0cf2c55223773f0e05956e74faae78c1332295559c4d625c0cb1280ee13d3
    container_name: stack-back
    # dcron (root-only binary) calls initgroups() before every job, even as root; without SETGID
    # crontab and every job fail while crond itself, and so the healthcheck, stays up.
    cap_add:
      - SETGID
    deploy:
      resources:
        limits:
          # 30-day peak 38M working set; backups run in separate runner containers
          memory: 64M
    healthcheck:
      test: ["CMD", "pgrep", "crond"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    # Restic repository, retention and schedule; INCLUDE_ALL_COMPOSE_PROJECTS backs up every Stack.
    env_file: ../stack-back.sops.env
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: critical
      startup-order: "3"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - backup_cache:/cache
      - ${ZFS_POOL_ROOT_HDD}/docker-backups:/backups
    networks:
      - default
      # Dumps the databases (stack-back.mariadb label) over this network.
      - backup

volumes:
  backup_cache:
    name: common_backup_cache
    external: true
