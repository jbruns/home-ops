# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  stack-back:
    # https://github.com/lawndoc/stack-back
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: ghcr.io/lawndoc/stack-back:v1.5.4@sha256:adb0cf2c55223773f0e05956e74faae78c1332295559c4d625c0cb1280ee13d3
    container_name: stack-back
    # dcron (root-only binary) calls initgroups() before every job, even as root; without SETGID
    # crontab and every job fail while crond itself, and so the healthcheck, stays up.
    cap_add:
      - SETGID
    deploy:
      resources:
        limits:
          # 30-day peak 38M is rcb alone (backups run in a separate, unlimited runner container), but
          # manual rcb status/snapshots run restic here too; 64M OOM-killed it.
          memory: 512M
    healthcheck:
      test: ["CMD", "pgrep", "crond"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    # Restic repository (the root of this Host's own B2 bucket, over the S3 API, ADR 0014), its
    # read-write key, retention and schedule; INCLUDE_ALL_COMPOSE_PROJECTS backs up every Stack.
    env_file: ../stack-back.sops.env
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: critical
      startup-order: "3"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - backup_cache:/cache
    networks:
      - default
      # Dumps the databases (stack-back.mariadb label) over this network.
      - backup

volumes:
  backup_cache:
    name: ops_stack-back_cache
    labels:
      homeops.regenerable: "restic rebuilds its cache from the repository"
