# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  sabnzbd:
    # https://github.com/home-operations/containers/pkgs/container/sabnzbd
    # https://github.com/sabnzbd/sabnzbd
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: ghcr.io/home-operations/sabnzbd:5.1.3@sha256:b1795982db498ed5691a7b1231f0fac7eed2a1d53e9c81b8e834d02695e76104
    user: ${SABNZBD_UID}:${MEDIA_SHARED_GID}
    container_name: sabnzbd
    deploy:
      resources:
        limits:
          # 30-day peak 255M working set
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/api?mode=version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      - TZ=${TZ}
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "sabnzbd_config"
      
      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.sabnzbd-http.rule: Host(`sabnzbd.${DOMAIN}`)
      traefik.http.routers.sabnzbd-http.entrypoints: http
      traefik.http.routers.sabnzbd-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.sabnzbd-https.rule: Host(`sabnzbd.${DOMAIN}`)
      traefik.http.routers.sabnzbd-https.entrypoints: https
      traefik.http.routers.sabnzbd-https.tls: true
      traefik.http.routers.sabnzbd-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.sabnzbd-https.service: sabnzbd
      traefik.http.routers.sabnzbd-https.middlewares: crowdsec-bouncer

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://sabnzbd.${DOMAIN}/api?mode=version

      traefik.http.services.sabnzbd.loadbalancer.server.port: 8080
    volumes:
      - sabnzbd_config:/config
      - ${ZFS_POOL_ROOT_HDD}/media/nzbdl:/data/nzbdl
      - ${ZFS_POOL_ROOT_HDD}/media/audiobooks:/data/audiobooks
      - ./abr_mover.py:/config/scripts/abr_mover.py:ro
    networks:
      - default
      - proxy

  sabnzbd-exporter:
    # https://github.com/onedr0p/exportarr
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    container_name: sabnzbd-exporter
    user: ${MEDIA_UID}:${MEDIA_GID}
    deploy:
      resources:
        limits:
          # 30-day peak 27M working set
          memory: 64M
    depends_on:
      sabnzbd:
        condition: service_healthy
    command: ["sabnzbd"]
    environment:
      # https://github.com/onedr0p/exportarr#configuration
      - PORT=9711
      - URL=http://sabnzbd:8080
      - APIKEY=${SABNZBD_API_KEY}
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: info
      startup-order: "3"
      # exportarr is distroless: no shell, wget or health subcommand to run a healthcheck with.
      baseline.exempt.healthcheck: "distroless image: no shell or health subcommand"
    networks:
      - default
      - metrics

  sabnzbd-status-exporter:
    # Usenet provider (server) health for Prometheus; a Custom Component (ADR 0008).
    # https://github.com/jbruns/homelab-components/tree/main/components/sabnzbd-status-exporter
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: ghcr.io/jbruns/sabnzbd-status-exporter:1.0.0@sha256:51789e8903602f34f262cb64d37f6003dd7dfa72df29ea6140a6e2e7bb8b3c84
    container_name: sabnzbd-status-exporter
    user: ${MEDIA_UID}:${MEDIA_GID}
    deploy:
      resources:
        limits:
          # 30-day peak 17M working set, measured on the bind-mounted script before the image
          memory: 64M
    read_only: true
    depends_on:
      sabnzbd:
        condition: service_healthy
    # Probes the exporter's own /healthz, never SABnzbd: SABnzbd being down shows as
    # sabnzbd_status_up 0 (SabnzbdStatusDown), not as this container going unhealthy.
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "-m", "sabnzbd_status_exporter", "healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    environment:
      - SABNZBD_URL=http://sabnzbd:8080
      - SABNZBD_API_KEY=${SABNZBD_API_KEY}
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: info
      startup-order: "3"
    networks:
      - default
      - metrics

volumes:
  sabnzbd_config:
    name: media_sabnzbd_config
    external: true