services:
  # Dependency Probes (GLOSSARY.md) for the arr Stack, run from the dependents' own network so
  # they take the same path Sonarr and Radarr do. Prometheus sends the targets
  # (monitoring/prometheus/dependencies.yaml) and reaches this prober over metrics.
  dependency-probe:
    # https://github.com/prometheus/blackbox_exporter
    image: prom/blackbox-exporter:v0.29.0
    container_name: dependency-probe-arr
    security_opt:
      - no-new-privileges=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    dns_search: .
    command:
      - '--config.file=/etc/blackbox_exporter/blackbox.yml'
      - '--log.level=warn'
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "3"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        tag: "{{.Name}}"
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    networks:
      - default
      - metrics
