# ARR STACK (deployed by doco-cd)
# Download clients and the apps that feed them. They talk to each other on the Stack's
# default network; the exporters also join metrics for Prometheus.

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
  # Prometheus and exporters; owned by the monitoring Stack (ADR-0002).
  metrics:
    name: metrics
    external: true

include:
  - ./arr-queue-exporter/docker-compose.yaml
  - ./autobrr/docker-compose.yaml
  - ./dependency-probe/docker-compose.yaml
  - ./qbittorrent/docker-compose.yaml
  - ./radarr/docker-compose.yaml
  - ./sabnzbd/docker-compose.yaml
  - ./sonarr/docker-compose.yaml
