services:
  arr-queue-exporter:
    # Stuck Sonarr/Radarr queue items (failed imports) for Prometheus; see arr_queue_exporter.py.
    # https://hub.docker.com/_/python
    image: python:3.14.8-alpine3.24
    container_name: arr-queue-exporter
    user: ${MEDIA_UID}:${MEDIA_GID}
    read_only: true
    security_opt:
      - no-new-privileges=true
    restart: unless-stopped
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    dns_search: .
    command: ["python3", "-u", "/app/arr_queue_exporter.py"]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9713/metrics"]
      interval: 60s
      timeout: 25s
      retries: 3
      start_period: 10s
      start_interval: 2s
    environment:
      - SONARR_URL=http://sonarr:8989
      - SONARR_API_KEY=${SONARR_API_KEY}
      - RADARR_URL=http://radarr:7878
      - RADARR_API_KEY=${RADARR_API_KEY}
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: info
      startup-order: "3"
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 1
        tag: "{{.Name}}"
    volumes:
      - ./arr_queue_exporter.py:/app/arr_queue_exporter.py:ro
    networks:
      - default
      - metrics
