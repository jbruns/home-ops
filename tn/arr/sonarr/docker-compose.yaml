services:
  sonarr:
    # https://github.com/home-operations/containers/pkgs/container/sonarr
    # https://github.com/Sonarr/Sonarr
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: ghcr.io/home-operations/sonarr:4.0.20.3012@sha256:1f19eb5e0f421418c1a956bbe01310a0141423afe28bd9a4b1dcb8629ff2bce2
    user: ${SONARR_UID}:${MEDIA_SHARED_GID}
    container_name: sonarr
    deploy:
      resources:
        limits:
          # 30-day peak 430M working set
          memory: 768M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8989/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      - TZ=${TZ}
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "sonarr_config"
      
      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.sonarr-http.rule: Host(`sonarr.${DOMAIN}`)
      traefik.http.routers.sonarr-http.entrypoints: http
      traefik.http.routers.sonarr-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.sonarr-https.rule: Host(`sonarr.${DOMAIN}`)
      traefik.http.routers.sonarr-https.entrypoints: https
      traefik.http.routers.sonarr-https.tls: true
      traefik.http.routers.sonarr-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.sonarr-https.service: sonarr
      traefik.http.routers.sonarr-https.middlewares: crowdsec-bouncer

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://sonarr.${DOMAIN}/ping

      traefik.http.services.sonarr.loadbalancer.server.port: 8989
    volumes:
      - sonarr_config:/config
      - ${ZFS_POOL_ROOT_HDD}/media:/data
    networks:
      - default
      - proxy

  sonarr-exporter:
    # https://github.com/onedr0p/exportarr
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    container_name: sonarr-exporter
    user: ${MEDIA_UID}:${MEDIA_GID}
    deploy:
      resources:
        limits:
          # 30-day peak 34M working set
          memory: 64M
    depends_on:
      sonarr:
        condition: service_healthy
    command: ["sonarr"]
    environment:
      # https://github.com/onedr0p/exportarr#configuration
      - PORT=9707
      - URL=http://sonarr:8989
      - APIKEY=${SONARR_API_KEY}
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: info
      startup-order: "3"
      # exportarr is distroless: no shell, wget or health subcommand to run a healthcheck with.
      baseline.exempt.healthcheck: "distroless image: no shell or health subcommand"
    networks:
      - default
      - metrics

volumes:
  sonarr_config:
    name: media_sonarr_config
    external: true