services:
  radarr:
    # https://github.com/home-operations/containers/pkgs/container/radarr
    # https://github.com/Radarr/Radarr
    image: ghcr.io/home-operations/radarr:6.4.4@sha256:be53998a2d39cfa3c3315b70c7509a6a1f2a10c3aee9337653efc9f4c970430e
    user: ${RADARR_UID}:${MEDIA_SHARED_GID}
    security_opt:
      - no-new-privileges=true
    container_name: radarr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7878/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    dns_search: .
    environment:
      - TZ=${TZ}
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "radarr_config"
      
      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.radarr-http.rule: Host(`radarr.${DOMAIN}`)
      traefik.http.routers.radarr-http.entrypoints: http
      traefik.http.routers.radarr-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.radarr-https.rule: Host(`radarr.${DOMAIN}`)
      traefik.http.routers.radarr-https.entrypoints: https
      traefik.http.routers.radarr-https.tls: true
      traefik.http.routers.radarr-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.radarr-https.service: radarr
      traefik.http.routers.radarr-https.middlewares: crowdsec-bouncer

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://radarr.${DOMAIN}/ping

      traefik.http.services.radarr.loadbalancer.server.port: 7878
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        tag: "{{.Name}}"
    volumes:
      - radarr_config:/config
      - ${ZFS_POOL_ROOT_HDD}/media:/data
    networks:
      - default
      - proxy

  radarr-exporter:
    # https://github.com/onedr0p/exportarr
    image: ghcr.io/onedr0p/exportarr:v2.3.0
    container_name: radarr-exporter
    user: ${MEDIA_UID}:${MEDIA_GID}
    security_opt:
      - no-new-privileges=true
    restart: unless-stopped
    depends_on:
      radarr:
        condition: service_healthy
    dns_search: .
    command: ["radarr"]
    environment:
      # https://github.com/onedr0p/exportarr#configuration
      - PORT=9708
      - URL=http://radarr:7878
      - APIKEY=${RADARR_API_KEY}
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: info
      startup-order: "3"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        tag: "{{.Name}}"
    networks:
      - default
      - metrics

volumes:
  radarr_config:
    name: media_radarr_config
    external: true