# QBITTORRENT STACK (deployed by doco-cd)
# qBittorrent, the BitTorrent Downloader. Organizers and autobrr reach it over downloads.

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
  # Requesters, Downloaders and Organizers talking to each other; owned by the edge Stack (ADR-0002).
  downloads:
    name: downloads
    external: true

include:
  - ./qbittorrent/service.yaml
