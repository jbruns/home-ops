# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  qbittorrent:
    # https://github.com/linuxserver/docker-qbittorrent
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: ghcr.io/linuxserver/qbittorrent:5.2.4@sha256:1ea873647c43d566f251a7122aee330b184509c57ee3257ed19f62dac0f8f24b
    container_name: qbittorrent
    # LSIO s6 image: run as the target user instead of PUID/PGID (chown + drop), so no caps.
    # s6 in non-root mode needs a /run it owns.
    user: ${QBITTORRENT_UID}:${MEDIA_SHARED_GID}
    tmpfs:
      - /run:uid=${QBITTORRENT_UID},gid=${MEDIA_SHARED_GID},mode=0755,exec
    deploy:
      resources:
        limits:
          # 30-day peak 5.6G working set, mostly page cache; RSS ~256M
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      # https://docs.linuxserver.io/images/docker-qbittorrent
      - TZ=${TZ}
      - TORRENTING_PORT=31728
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "qbittorrent_config"
      
      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.qbittorrent-http.rule: Host(`qbittorrent.${DOMAIN}`)
      traefik.http.routers.qbittorrent-http.entrypoints: http
      traefik.http.routers.qbittorrent-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.qbittorrent-https.rule: Host(`qbittorrent.${DOMAIN}`)
      traefik.http.routers.qbittorrent-https.entrypoints: https
      traefik.http.routers.qbittorrent-https.tls: true
      traefik.http.routers.qbittorrent-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.qbittorrent-https.service: qbittorrent
      traefik.http.routers.qbittorrent-https.middlewares: crowdsec-bouncer

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://qbittorrent.${DOMAIN}/

      traefik.http.services.qbittorrent.loadbalancer.server.port: 8080
    ports:
      # Bittorrent inbound
      - 31728:31728
      - 31728:31728/udp
    volumes:
      # Logs (ADR 0007): qBittorrent can't send its log to stdout (only Qt warnings reach it). Its file
      # logger (/config/qBittorrent/logs) caps each file at 65 KB and deletes backups after a month
      # (qBittorrent.conf).
      - qbittorrent_config:/config
      # Media mounts never create their source (ADR 0009): a missing folder fails the Deploy
      # instead of becoming a root-owned empty folder.
      # BitTorrent Downloader: its own folder (torrents for no Library) and the torrents/ folder of
      # each Library whose Organizer has a torrent client (Shelfmark: Books, Audiobooks), which the
      # Organizer copies from while seeding continues. Never a Library. TV and Movies get theirs
      # when Sonarr or Radarr get a torrent client.
      - type: bind
        source: ${ZFS_POOL_ROOT_HDD}/media/tordl
        target: /data/tordl
        bind:
          create_host_path: false
      - type: bind
        source: ${ZFS_POOL_ROOT_HDD}/media/books/torrents
        target: /data/books/torrents
        bind:
          create_host_path: false
      - type: bind
        source: ${ZFS_POOL_ROOT_HDD}/media/audiobooks/torrents
        target: /data/audiobooks/torrents
        bind:
          create_host_path: false
    networks:
      - default
      - downloads
      - proxy

volumes:
  qbittorrent_config:
    name: qbittorrent_config
    external: true