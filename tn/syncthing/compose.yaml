services:
  syncthing:
    # https://github.com/syncthing/syncthing/blob/main/README-Docker.md
    # https://hub.docker.com/r/syncthing/syncthing/tags
    extends:
      file: ../_baseline.yaml
      service: baseline
    image: syncthing/syncthing:2.1@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546
    container_name: syncthing
    # Started directly as the data's owner, the entrypoint skips its chown and su-exec, so no caps.
    user: ${HOME_UID}:${HOME_GID}
    deploy:
      resources:
        limits:
          # 30-day peak 74M
          memory: 128M
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "syncthing_data"
      
      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.syncthing-http.rule: Host(`syncthing.${DOMAIN}`)
      traefik.http.routers.syncthing-http.entrypoints: http
      traefik.http.routers.syncthing-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.syncthing-https.rule: Host(`syncthing.${DOMAIN}`)
      traefik.http.routers.syncthing-https.entrypoints: https
      traefik.http.routers.syncthing-https.tls: true
      traefik.http.routers.syncthing-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.syncthing-https.service: syncthing
      traefik.http.routers.syncthing-https.middlewares: crowdsec-bouncer

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://syncthing.${DOMAIN}/rest/noauth/health
      # plex.<domain> is DNS-only (the WAN address); proxied names don't carry raw TCP
      probe.tcp: plex.${DOMAIN}:22000

      traefik.http.services.syncthing.loadbalancer.server.port: 8384
    ports:
      - 22000:22000  # Sync (TCP)
      - 22000:22000/udp  # Sync (QUIC)
    healthcheck:
      test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s
    volumes:
      - syncthing_data:/var/syncthing
    networks:
      - default
      - proxy

volumes:
  syncthing_data:
    name: syncthing_data
    external: true

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
