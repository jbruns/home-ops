services:
  promtail:
    image:  grafana/promtail:3.6.11@sha256:a761cb834cfaeee29745440d4884d6748f0a08d8f68928db1d707018c1dcfbe9
    container_name: promtail
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    dns_search: .
    command: -config.file=/etc/promtail/docker-config.yml
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "3"
      # logs collection
      logging: promtail
      logging_jobname: containerlogs
      stackname: monitoring
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 1
        tag: "{{.Name}}"
    volumes:
      - ./docker-config.yml:/etc/promtail/docker-config.yml:ro
      - ${DOCKER_DATA_ROOT}/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
