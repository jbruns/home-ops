# Dashboards generated by ../dashboards.py into ../dashboards/ (edit the generator, not the JSON).
# Read-only in the UI: changes go through the repo; "Save as" copies still work.
apiVersion: 1
providers:
  - name: home-ops
    folder: home-ops
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
