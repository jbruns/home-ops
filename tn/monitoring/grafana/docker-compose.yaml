services:
  grafana:
    # https://hub.docker.com/r/grafana/grafana/tags
    image: grafana/grafana:12.4.12@sha256:83be3e511ede559bee80e2215bb1987cb1246075461cb961beb515b0341e7aea
    container_name: grafana
    user: ${MONITORING_UID}:${MONITORING_GID}
    security_opt:
      - no-new-privileges=true
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    dns_search: .
    environment:
      # https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana
      # GF_<SectionName>_<KeyName>
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=critical
      - GF_FEATURE_TOGGLES_ENABLE=lokiLogsDataplane
      # Added to Grafana's default preinstall set, which already includes Logs Drilldown.
      - GF_PLUGINS_PREINSTALL=grafana-polystat-panel
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      # Tier overview, generated by dashboards.py
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/overview.json
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "grafana_data"
      
      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.grafana-http.rule: Host(`grafana.${DOMAIN}`)
      traefik.http.routers.grafana-http.entrypoints: http
      traefik.http.routers.grafana-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.grafana-https.rule: Host(`grafana.${DOMAIN}`)
      traefik.http.routers.grafana-https.entrypoints: https
      traefik.http.routers.grafana-https.tls: true
      traefik.http.routers.grafana-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.grafana-https.service: grafana
      traefik.http.routers.grafana-https.middlewares: crowdsec-bouncer

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://grafana.${DOMAIN}/api/health

      traefik.http.services.grafana.loadbalancer.server.port: 3000
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        tag: "{{.Name}}"
    volumes:
      - type: bind
        source: ./provisioning/datasources.sops.yml
        target: /etc/grafana/provisioning/datasources/provisioning-datasources.yaml
        read_only: true
        # Stored encrypted in repo
        x-sops: true
      - type: bind
        source: ./provisioning/dashboards.yml
        target: /etc/grafana/provisioning/dashboards/home-ops.yaml
        read_only: true
      - type: bind
        source: ./dashboards
        target: /etc/grafana/dashboards
        read_only: true
      - grafana_data:/var/lib/grafana
    networks:
      - default
      - proxy

volumes:
  grafana_data:
    name: monitoring_grafana_data
    external: true