# Modules a Service picks with its `probe.module` label (default http_2xx).
modules:
  http_2xx:
    prober: http
    timeout: 8s
    http:
      valid_status_codes: []  # 2xx

  # Behind basic auth: a 401 from the Service itself means it is up.
  http_auth:
    prober: http
    timeout: 8s
    http:
      valid_status_codes: [401]

  # A Protected Service (`probe.idp_url`, job probe-idp): the IdP outpost answers an anonymous request
  # by redirecting to the IdP's authorize endpoint. Not followed, so the IdP is never touched.
  http_idp_redirect:
    prober: http
    timeout: 8s
    http:
      follow_redirects: false
      valid_status_codes: [302]
      fail_if_header_not_matches:
        - header: Location
          regexp: /application/o/authorize/

  tcp_connect:
    prober: tcp
    timeout: 8s
