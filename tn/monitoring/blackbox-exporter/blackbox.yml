# Modules a Service picks with its `probe.module` label (default http_2xx), and that a
# Dependency Probe names in `module` (prometheus/dependencies.yml).
modules:
  http_2xx:
    prober: http
    timeout: 8s
    http:
      valid_status_codes: []  # 2xx

  # Behind basic auth: a 401 from the Service itself means it is up.
  http_auth:
    prober: http
    timeout: 8s
    http:
      valid_status_codes: [401]

  # A Protected Service (`probe.idp_url`, job probe-idp): the IdP outpost answers an anonymous request
  # by redirecting to the IdP's authorize endpoint. Not followed, so the IdP is never touched.
  http_idp_redirect:
    prober: http
    timeout: 8s
    http:
      follow_redirects: false
      valid_status_codes: [302]
      fail_if_header_not_matches:
        - header: Location
          regexp: /application/o/authorize/

  tcp_connect:
    prober: tcp
    timeout: 8s

  # SABnzbd `api?mode=version`: unauthenticated, answers {"version": ...}.
  sabnzbd:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp: ['"version"']

  # A newznab search as the dependent sends it. nzbhydra2 reports failures as an <error> body
  # with HTTP 200, and `t=caps` kept answering through the 2026-10-17 H2 outage.
  newznab:
    prober: http
    timeout: 25s
    http:
      preferred_ip_protocol: ip4
      fail_if_body_matches_regexp: ['<error ']
      fail_if_body_not_matches_regexp: ['<channel>']
