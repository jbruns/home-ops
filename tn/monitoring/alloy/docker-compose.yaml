services:
  alloy:
    # https://github.com/grafana/alloy
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    container_name: alloy
    user: ${MONITORING_UID}:${MONITORING_GID}
    deploy:
      resources:
        limits:
          # 30-day peak 221M working set
          memory: 384M
    # Reads container logs through the Docker API
    group_add:
      - ${DOCKER_GID}
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/alloy
      - --disable-reporting
      - /etc/alloy/config.alloy
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "3"
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      # Read positions, so a restart neither re-ships nor skips logs. Not /var/lib/alloy/data:
      # Docker would copy the image's 473:0770 ownership onto the empty volume.
      - alloy_data:/alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_log:/var/log/traefik:ro
    networks:
      - default
      - metrics

volumes:
  alloy_data:
    name: monitoring_alloy_data
    external: true
  # Owned by the edge Stack
  traefik_log:
    name: common_traefik_log
    external: true
