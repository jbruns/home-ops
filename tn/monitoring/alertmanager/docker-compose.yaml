services:  
  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: alertmanager
    user: ${MONITORING_UID}:${MONITORING_GID}
    security_opt:
      - no-new-privileges=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9093"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    dns_search: .
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--web.config.file=/etc/alertmanager/web.yml'
      - '--log.level=error'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://alertmanager.${DOMAIN}'
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: critical
      startup-order: "1"
      stack-back.volumes: true
      stack-back.volumes.include: "alertmanager_data"
      
      # logs collection
      logging: promtail
      logging_jobname: containerlogs
      stackname: monitoring

      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.alertmanager-http.rule: Host(`alertmanager.${DOMAIN}`)
      traefik.http.routers.alertmanager-http.entrypoints: http
      traefik.http.routers.alertmanager-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.alertmanager-https.rule: Host(`alertmanager.${DOMAIN}`)
      traefik.http.routers.alertmanager-https.entrypoints: https
      traefik.http.routers.alertmanager-https.tls: true
      traefik.http.routers.alertmanager-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.alertmanager-https.service: alertmanager
      traefik.http.routers.alertmanager-https.middlewares: crowdsec-bouncer

      traefik.http.services.alertmanager.loadbalancer.server.port: 9093
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 1
        tag: "{{.Name}}"
    volumes:
      - ./config.yml:/etc/alertmanager/config.yml:ro
      - type: bind
        source: ./web.sops.yml
        target: /etc/alertmanager/web.yml
        read_only: true
        # Stored encrypted in repo
        x-sops: true
      - alertmanager_data:/alertmanager
    secrets:
      - pushover_user_key
      - pushover_token
      - discord_webhook
      - watchdog_url
    networks:
      - default
      - proxy

volumes:
  alertmanager_data:
    name: monitoring_alertmanager_data
    external: true

# Stored encrypted in repo as <name>.sops.txt
secrets:
  pushover_user_key:
    file: ./pushover_user_key.sops.txt
  pushover_token:
    file: ./pushover_token.sops.txt
  discord_webhook:
    file: ./discord_webhook.sops.txt
  watchdog_url:
    file: ./watchdog_url.sops.txt
