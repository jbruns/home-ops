# Routing by Tier (see GLOSSARY.md):
#   critical -> Pushover Page, and also the Discord Digest for the record
#   warning  -> Discord Digest, grouped per Stack, repeated every 12h
#   info     -> never notifies
#   Watchdog -> Heartbeat to healthchecks.io; silence means the alert pipeline is broken
# An alert without a tier label falls through to Discord so it can't go unseen.
# Secrets are SOPS-encrypted in the repo and mounted as Compose secrets.
global:
  resolve_timeout: 5m

route:
  receiver: discord
  group_by: [stack]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers: [alertname="Watchdog"]
      receiver: heartbeat
      group_by: [alertname]
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - matchers: [tier="info"]
      receiver: blackhole
    - matchers: [tier="critical"]
      receiver: pushover
      group_by: [stack, alertname]
      group_wait: 10s
      repeat_interval: 4h
      continue: true
    - matchers: [tier=~"critical|warning"]
      receiver: discord

# With the Internet or Traefik down every Probe fails; report the cause, not each Service. Traefik
# is down when TraefikDown fires (stopped or hung: a stopped Traefik has no Probe target) or its own
# Probe fails (running but not routing). TraefikDown is the one Page for Traefik, so it also inhibits
# Traefik's own ProbeFailed (a hung Traefik keeps its Probe target), ContainerDown and TargetDown. A stopped container is ContainerDown, not its TargetDown
# or internal DependencyDown; those wait 9m in alerting-rules.yml so ContainerDown is already firing
# when they would.
inhibit_rules:
  - source_matchers: [alertname="InternetDown"]
    target_matchers: [alertname="ProbeFailed"]
  - source_matchers: [alertname="ProbeFailed", container="traefik"]
    target_matchers: [alertname="ProbeFailed", job=~"probe|probe-idp", container!="traefik"]
  - source_matchers: [alertname="TraefikDown"]
    target_matchers: [alertname="ProbeFailed", job=~"probe|probe-idp"]
  - source_matchers: [alertname="TraefikDown"]
    target_matchers: [alertname="TargetDown", job="traefik"]
  - source_matchers: [alertname="TraefikDown"]
    target_matchers: [alertname="ContainerDown", name="traefik"]
  - source_matchers: [alertname="ProbeFailed"]
    target_matchers: [alertname="DependencyDown", kind="internal"]
    equal: [container]
  - source_matchers: [alertname="InternetDown"]
    target_matchers: [alertname="DependencyDown", kind="external"]
  - source_matchers: [alertname="ContainerDown"]
    target_matchers: [alertname=~"TargetDown|DependencyDown"]
    equal: [container]
  - source_matchers: [alertname="ContainerDown"]
    target_matchers: [alertname="DatastoreDown"]
    equal: [name]
  - source_matchers: [alertname="ContainerDown"]
    target_matchers: [alertname="ContainerHealthExporterBlind"]
    equal: [name]
  - source_matchers: [alertname="ContainerDown", name="docker-socket-proxy"]
    target_matchers: [alertname="BackupCoverageBlind"]
  - source_matchers: [alertname="BackupCoverageBlind"]
    target_matchers: [alertname="BackupCoverageUnknown"]
  - source_matchers: [alertname="DependencyDown"]
    target_matchers: [alertname="ArrHealthIssue"]
    equal: [to]
  - source_matchers: [alertname="ProbeFailed"]
    target_matchers: [alertname="Http5xxRatio"]
    equal: [container]
  # The IdP outpost (edge): report the broken outpost, not every Protected Service; and an IdP
  # outage, not the outpost losing it.
  - source_matchers: [alertname="IdpForwardAuthFailing"]
    target_matchers: [alertname="ProbeFailed", job="probe-idp", auth="forward"]
  - source_matchers: [alertname="InternetDown"]
    target_matchers: [alertname="IdpForwardAuthFailing"]
  - source_matchers: [alertname="ProbeFailed", container="traefik"]
    target_matchers: [alertname="IdpForwardAuthFailing"]
  - source_matchers: [alertname="TraefikDown"]
    target_matchers: [alertname="IdpForwardAuthFailing"]
  - source_matchers: [alertname="DependencyDown", to="idp"]
    target_matchers: [alertname="IdpOutpostDisconnected"]

receivers:
  - name: blackhole

  - name: heartbeat
    webhook_configs:
      - url_file: /run/secrets/watchdog_url
        send_resolved: false

  - name: pushover
    pushover_configs:
      - user_key_file: /run/secrets/pushover_user_key
        token_file: /run/secrets/pushover_token
        priority: '{{ if eq .Status "firing" }}1{{ else }}0{{ end }}'
        send_resolved: true

  - name: discord
    discord_configs:
      - webhook_url_file: /run/secrets/discord_webhook
        send_resolved: true
