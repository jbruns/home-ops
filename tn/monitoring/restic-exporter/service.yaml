# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  restic-exporter:
    # https://github.com/ngosang/restic-exporter
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: ngosang/restic-exporter:2.1.2@sha256:a8f9cfa3016237c7008aefa4d9c6639bc9b34d2582eed07ac58dcf56632e4170
    container_name: restic-exporter
    deploy:
      resources:
        limits:
          # 30-day peak 1094M working set
          memory: 1792M
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8001/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    # The B2 repository stack-back writes to, and a read-only key for it (shared with backup-coverage).
    env_file: ./b2.sops.env
    environment:
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      REFRESH_INTERVAL: "3600"
      INCLUDE_PATHS: "true"
      # stack-back already runs `restic check` after every backup; a second check here would contend for the lock.
      NO_CHECK: "true"
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "3"

    volumes:
      # restic's cache, kept across recreates so each refresh reads little from B2; not backed up.
      - restic-exporter_cache:/root/.cache/restic
    secrets:
      - restic_password
    networks:
      - default

volumes:
  restic-exporter_cache:
    name: monitoring_restic-exporter_cache
    labels:
      homeops.regenerable: "restic rebuilds its cache from the repository"

# Stored encrypted in repo as <name>.sops.txt
secrets:
  restic_password:
    file: ./restic_password.sops.txt
