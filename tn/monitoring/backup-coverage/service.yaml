# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  # Per-volume backup coverage (backup_coverage.py). Same image for python and restic.
  backup-coverage:
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: ngosang/restic-exporter:2.1.2@sha256:a8f9cfa3016237c7008aefa4d9c6639bc9b34d2582eed07ac58dcf56632e4170
    container_name: backup-coverage
    deploy:
      resources:
        limits:
          # 30-day peak 938M working set
          memory: 1536M
    entrypoint: ["/sbin/tini", "--"]
    command: ["python3", "-u", "/app/backup_coverage.py"]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8002/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      RESTIC_REPOSITORY: /backups
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      RESTIC_CACHE_DIR: /tmp/restic-cache
      REFRESH_INTERVAL: "3600"
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "3"
    # Root, like restic-exporter: the repository files are root-only (0400).
    volumes:
      - ./backup_coverage.py:/app/backup_coverage.py:ro
      - ${ZFS_POOL_ROOT_HDD}/docker-backups:/backups:ro
      # Reads stack-back labels and mounts of every container, stopped ones too.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    secrets:
      - restic_password
    networks:
      - default

# restic-exporter's repository password, stored encrypted in repo as <name>.sops.txt
secrets:
  restic_password:
    file: ../restic-exporter/restic_password.sops.txt
