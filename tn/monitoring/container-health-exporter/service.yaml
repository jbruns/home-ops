# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  container-health-exporter:
    # Docker health-check status for Prometheus (Uptime of Services that are not Exposed Services);
    # a Custom Component (ADR 0008). Reads through the read-only docker-socket-proxy.
    # Source: components/container-health-exporter in the Repo Tooling repo.
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: ghcr.io/jbruns/container-health-exporter:1.0.0@sha256:3ab4c8d11ecfdfb6af4c1f7e8599fd7f63459440e4149f297f1f67ba175e08a8
    container_name: container-health-exporter
    user: ${MONITORING_UID}:${MONITORING_GID}
    deploy:
      resources:
        limits:
          # 30-day peak 26M working set, measured on the bind-mounted script before the image
          memory: 64M
    read_only: true
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    # Probes the exporter's own /healthz, never Docker: the Docker API failing shows as
    # container_health_up 0, not as this container going unhealthy.
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "-m", "container_health_exporter", "healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    environment:
      # GET /v1.44/containers/json and /v1.44/containers/<id>/json; the proxy's CONTAINERS=1 allows both.
      - DOCKER_HOST=docker-socket-proxy:2375
      # Keep the `tier` label on container_healthy and skip ad-hoc containers (ADR 0003), as before.
      - CONTAINER_LABELS=tier
      - IGNORE_LABEL=startup-order=skip
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: info
      startup-order: "3"
    networks:
      - default
