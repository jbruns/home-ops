groups:
- name: prometheus_node_exporter_rules
  rules:
  - expr: count without (cpu) (count without (mode) (node_cpu_seconds_total{job="node-exporter"}))
    record: instance:node_num_cpu:sum
  - expr: 1 - avg without (cpu, mode) (rate(node_cpu_seconds_total{job="node-exporter", mode="idle"}[1m]))
    record: instance:node_cpu_utilisation:rate1m
  - expr: (node_load1{job="node-exporter"} / instance:node_num_cpu:sum{job="node-exporter"})
    record: instance:node_load1_per_cpu:ratio
  - expr: 1 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"})
    record: instance:node_memory_utilisation:ratio
  - expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100)
    record: instance:node_memory_utilisation:percentage
  - expr: rate(node_vmstat_pgmajfault{job="node-exporter"}[1m])
    record: instance:node_vmstat_pgmajfault:rate1m
  - expr: rate(node_disk_io_time_seconds_total{job="node-exporter", device!=""}[1m])
    record: instance_device:node_disk_io_time_seconds:rate1m
  - expr: rate(node_disk_io_time_weighted_seconds_total{job="node-exporter", device!=""}[1m])
    record: instance_device:node_disk_io_time_weighted_seconds:rate1m
  - expr: sum without (device) (rate(node_network_receive_bytes_total{job="node-exporter", device!="lo"}[1m]))
    record: instance:node_network_receive_bytes_excluding_lo:rate1m
  - expr: sum without (device) (rate(node_network_transmit_bytes_total{job="node-exporter", device!="lo"}[1m]))
    record: instance:node_network_transmit_bytes_excluding_lo:rate1m
  - expr: sum without (device) (rate(node_network_receive_drop_total{job="node-exporter", device!="lo"}[1m]))
    record: instance:node_network_receive_drop_excluding_lo:rate1m
  - expr: sum without (device) (rate(node_network_transmit_drop_total{job="node-exporter", device!="lo"}[1m]))
    record: instance:node_network_transmit_drop_excluding_lo:rate1m

# HTTP status mix per Service, from Traefik. `container` is the Traefik service name without
# its provider (`sonarr@docker` -> `sonarr`), which matches the container name for every
# Service here. 501 (a client sent a method the Service does not implement) is not counted
# as a server error.
- name: traefik_services
  rules:
  - record: container:traefik_service_requests:rate10m
    expr: sum by (container) (label_replace(rate(traefik_service_requests_total[10m]), "container", "$1", "service", "(.+)@.+"))
  - record: container:traefik_service_5xx:rate10m
    expr: |
      sum by (container) (label_replace(rate(traefik_service_requests_total{code=~"5..", code!="501"}[10m]), "container", "$1", "service", "(.+)@.+"))
      or container:traefik_service_requests:rate10m * 0
  - record: container:traefik_service_5xx:ratio10m
    expr: container:traefik_service_5xx:rate10m / container:traefik_service_requests:rate10m

# HTTP status mix per router. Unlike service metrics, router metrics also count what a middleware
# answers before the Service: forward auth's 302/401, the CrowdSec bouncer's 403. Router names
# carry their kind (ADR 0006, enforced by validate.py): `<container>-https` is `ui`, `-http`,
# `-health`, and `-client-<protocol>` is `client` (the protocol stays in `router`). 401s on
# `client` routers are a user's or a brute-forcer's failed sign-in. Probes count too: a
# basic-auth Service's `ui` 401s are mostly its own Probe.
- name: traefik_routers
  rules:
  - record: container_route:traefik_router_requests:rate10m
    expr: |
      sum by (container, router, route_kind, code_class) (
        label_replace(label_replace(label_replace(label_replace(label_replace(
          rate(traefik_router_requests_total{router=~".+-(https?|health|client-[a-z0-9]+)@.+"}[10m]),
          "container", "$1", "router", "(.+)-(?:https?|health|client-[a-z0-9]+)@.+"),
          "route_kind", "$1", "router", ".+-(https?|health|client)(?:-[a-z0-9]+)?@.+"),
          "route_kind", "ui", "route_kind", "https"),
          "router", "$1", "router", "(.+)@.+"),
          "code_class", "${1}xx", "code", "(.).."))
  - record: container_route:traefik_router_4xx:rate10m
    expr: |
      sum by (container, router, route_kind, code) (
        label_replace(label_replace(label_replace(label_replace(
          rate(traefik_router_requests_total{router=~".+-(https?|health|client-[a-z0-9]+)@.+", code=~"4.."}[10m]),
          "container", "$1", "router", "(.+)-(?:https?|health|client-[a-z0-9]+)@.+"),
          "route_kind", "$1", "router", ".+-(https?|health|client)(?:-[a-z0-9]+)?@.+"),
          "route_kind", "ui", "route_kind", "https"),
          "router", "$1", "router", "(.+)@.+"))

# Uptime and Availability (GLOSSARY.md). An Exposed Service is up while every one of its Probes
# succeeds; any other Service while its health check reports healthy (container-health-exporter).
# Containers with neither have no Uptime. Docker briefly renames a container it is recreating
# to `<12 hex>_<name>`; those are not Services. Availability is the rolling 1d share of Uptime; read it
# at midnight for daily figures, or average it for longer periods.
- name: availability
  interval: 1m
  rules:
  - record: service:uptime:ok
    expr: |
      min by (container, stack, tier) (probe_success{job=~"probe|probe-tcp|probe-idp"})
      or on (container)
      max by (container, stack, tier) (container_healthy{job="container-health", container!~"[0-9a-f]{12}_.+"})
  - record: service:availability:ratio1d
    expr: avg_over_time(service:uptime:ok[1d])
