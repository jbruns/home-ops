# Alert rules. Every alert carries `tier` (critical | warning | info) and `stack`;
# Alertmanager routes on `tier` (see alertmanager/config.yml and GLOSSARY.md).
groups:
  - name: meta
    rules:
      # Heartbeat: always firing. healthchecks.io raises the alarm when it stops arriving.
      - alert: Watchdog
        expr: vector(1)
        labels:
          tier: heartbeat
          stack: monitoring
        annotations:
          summary: Alerting pipeline heartbeat

  - name: targets
    rules:
      # `tier` and `stack` come from the scrape target's labels (prometheus.yml).
      - alert: TargetDown
        expr: up == 0
        for: 5m
        annotations:
          summary: "{{ $labels.job }} scrape target is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} ({{ $labels.job }}) for 5 minutes."

  - name: containers
    rules:
      # cAdvisor stops reporting a container once it is gone. Looking back over a day keeps
      # the alert firing until the container returns, or for up to 24h after a deliberate removal.
      - alert: ContainerDown
        expr: |
          time() - max by (name, container_label_tier, container_label_com_docker_compose_project) (
            max_over_time(container_last_seen{container_label_tier=~"critical|warning"}[1d])
          ) > 120
        for: 1m
        labels:
          tier: "{{ $labels.container_label_tier }}"
          stack: "{{ $labels.container_label_com_docker_compose_project }}"
        annotations:
          summary: "{{ $labels.name }} is not running"
          description: "Container {{ $labels.name }} ({{ $labels.container_label_com_docker_compose_project }}) was last seen {{ $value | humanizeDuration }} ago."

      - alert: ContainerRestarting
        expr: |
          sum by (name, container_label_tier, container_label_com_docker_compose_project) (
            changes(container_start_time_seconds{container_label_tier=~"critical|warning"}[15m])
          ) > 2
        labels:
          tier: "{{ $labels.container_label_tier }}"
          stack: "{{ $labels.container_label_com_docker_compose_project }}"
        annotations:
          summary: "{{ $labels.name }} is restarting repeatedly"
          description: "Container {{ $labels.name }} started {{ $value }} times in 15 minutes."

      # Only meaningful once a container has a memory limit.
      - alert: ContainerMemoryNearLimit
        expr: |
          max by (name, container_label_com_docker_compose_project) (
            container_memory_working_set_bytes{container_label_tier=~"critical|warning"}
              / (container_spec_memory_limit_bytes > 0)
          ) > 0.9
        for: 15m
        labels:
          tier: warning
          stack: "{{ $labels.container_label_com_docker_compose_project }}"
        annotations:
          summary: "{{ $labels.name }} is near its memory limit"
          description: "{{ $labels.name }} is using {{ $value | humanizePercentage }} of its memory limit."

  - name: host
    rules:
      # TrueNAS native alerts are the first line for pool and disk health; this is the second.
      - alert: ZpoolNotOnline
        expr: node_zfs_zpool_state{state!="online"} > 0
        for: 1m
        labels:
          tier: critical
          stack: host
        annotations:
          summary: "ZFS pool {{ $labels.zpool }} is {{ $labels.state }}"

      - alert: HostOutOfMemory
        expr: node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"} < 0.05
        for: 5m
        labels:
          tier: warning
          stack: host
        annotations:
          summary: Host memory is nearly exhausted
          description: "Only {{ $value | humanizePercentage }} of memory is available."

      - alert: HostConntrackNearLimit
        expr: node_nf_conntrack_entries{job="node-exporter"} / node_nf_conntrack_entries_limit{job="node-exporter"} > 0.75
        for: 5m
        labels:
          tier: warning
          stack: host
        annotations:
          summary: Host conntrack table is {{ $value | humanizePercentage }} full

      - alert: HostClockNotSynchronising
        expr: min_over_time(node_timex_sync_status{job="node-exporter"}[5m]) == 0 and node_timex_maxerror_seconds{job="node-exporter"} >= 16
        for: 10m
        labels:
          tier: warning
          stack: host
        annotations:
          summary: Host clock is not synchronising

  - name: backups
    rules:
      # stack-back writes one snapshot of all volumes plus one per database dump. Snapshot
      # groups also carry the container hostname, which changes on every recreate, so take the
      # newest snapshot per path.
      - alert: BackupStale
        expr: time() - max by (snapshot_paths) (restic_backup_timestamp) > 26 * 3600
        labels:
          tier: critical
          stack: common
        annotations:
          summary: "No backup of {{ $labels.snapshot_paths }} in over 26h"
          description: "The newest restic snapshot of {{ $labels.snapshot_paths }} is {{ $value | humanizeDuration }} old."

      - alert: BackupMetricsMissing
        expr: absent(restic_backup_timestamp)
        for: 3h
        labels:
          tier: critical
          stack: common
        annotations:
          summary: Backup freshness is unknown
          description: The restic exporter has reported no snapshots for 3 hours, so BackupStale cannot fire.
