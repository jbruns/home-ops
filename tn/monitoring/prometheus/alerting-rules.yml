# Alert rules. Every alert carries `tier` (critical | warning | info) and `stack`;
# Alertmanager routes on `tier` (see alertmanager/config.yml and GLOSSARY.md).
groups:
  - name: meta
    rules:
      # Heartbeat: always firing. healthchecks.io raises the alarm when it stops arriving.
      - alert: Watchdog
        expr: vector(1)
        labels:
          tier: heartbeat
          stack: monitoring
        annotations:
          summary: Alerting pipeline heartbeat

  - name: targets
    rules:
      # `tier` and `stack` come from the scrape target's labels (prometheus.yml).
      # For Probe jobs `up` only says blackbox-exporter answered; its own job covers that.
      - alert: TargetDown
        expr: up{job!~"probe|probe-tcp|probe-idp|internet|dependency"} == 0
        for: 5m
        annotations:
          summary: "{{ $labels.job }} scrape target is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} ({{ $labels.job }}) for 5 minutes."

  - name: probes
    rules:
      # Uptime of an Exposed Service (GLOSSARY.md). `tier`, `stack` and `container` come from
      # the probed Service. Inhibited while InternetDown or Traefik's own Probe fails (alertmanager).
      - alert: ProbeFailed
        expr: probe_success{job=~"probe|probe-tcp|probe-idp"} == 0
        for: 3m
        annotations:
          summary: "{{ $labels.container }} is unreachable"
          description: "The {{ $labels.module }} Probe of {{ $labels.container }} ({{ $labels.instance }}) has failed for 3 minutes."

      - alert: InternetDown
        expr: max(probe_success{job="internet"}) == 0
        for: 2m
        labels:
          tier: warning
          stack: monitoring
        annotations:
          summary: The Internet is unreachable
          description: Every Internet Probe has failed for 2 minutes; Probe alerts are inhibited.

      # More than 5% of a Service's requests through Traefik are server errors (recording-rules.yml),
      # with at least 5 in 10 minutes so a single failure at Probe-only traffic does not count.
      # Digest regardless of the Service's Tier; ProbeFailed inhibits it (alertmanager). `stack`
      # comes from the container; a Traefik service with no matching container reports as edge.
      - alert: Http5xxRatio
        expr: |
          (
              (container:traefik_service_5xx:ratio10m > 0.05 and container:traefik_service_5xx:rate10m * 600 >= 5)
            * on (container) group_left (stack)
              group by (container, stack) (
                label_replace(label_replace(container_last_seen{name!=""}, "container", "$1", "name", "(.+)"),
                  "stack", "$1", "container_label_com_docker_compose_project", "(.+)")
              )
          )
          or on (container)
            label_replace(container:traefik_service_5xx:ratio10m > 0.05 and container:traefik_service_5xx:rate10m * 600 >= 5,
              "stack", "edge", "", "")
        for: 10m
        labels:
          tier: warning
        annotations:
          summary: "{{ $labels.container }} is returning server errors"
          description: "{{ $value | humanizePercentage }} of {{ $labels.container }}'s requests through Traefik have been 5xx for 10 minutes."

      # docker_sd lost its targets (docker-socket-proxy down or labels gone): Probes have gone silent.
      - alert: ProbesMissing
        expr: absent(probe_success{job="probe"})
        for: 10m
        labels:
          tier: warning
          stack: monitoring
        annotations:
          summary: No Probe results
          description: Prometheus has no Probe targets; check docker-socket-proxy and the probe.url labels.

      # A Dependency (GLOSSARY.md) fails for every dependent: alert once, on the Dependency, at the
      # Tier its edges carry (dependencies.yaml). Inhibited by the Dependency's own ProbeFailed
      # (internal) or InternetDown (external).
      - alert: DependencyDown
        expr: max by (to, kind, container, tier, stack) (probe_success{job="dependency"}) == 0
        for: 5m
        annotations:
          summary: "{{ $labels.to }} is failing its dependents"
          description: "Every Dependency Probe of {{ $labels.to }} ({{ $labels.kind }}) has failed for 5 minutes."

      - alert: DependencyProbesMissing
        expr: absent(probe_success{job="dependency"})
        for: 10m
        labels:
          tier: warning
          stack: monitoring
        annotations:
          summary: No Dependency Probe results
          description: Prometheus has no Dependency Probe targets; check dependencies.yaml and the probers.

  - name: containers
    rules:
      # cAdvisor stops reporting a container once it is gone. Looking back over a day keeps
      # the alert firing until the container returns, or for up to 24h after a deliberate removal
      # (silence the retired Stack). Keyed on Compose project + service, newest container wins, so
      # a recreate that renames the container (doco-cd self-update) or changes labels is not "down".
      - alert: ContainerDown
        expr: |
          time() - topk by (container_label_com_docker_compose_project, container_label_com_docker_compose_service) (1,
            max by (name, container_label_tier, container_label_com_docker_compose_project, container_label_com_docker_compose_service) (
              max_over_time(container_last_seen{container_label_tier=~"critical|warning"}[1d])
            )
          ) > 120
        for: 1m
        labels:
          tier: "{{ $labels.container_label_tier }}"
          stack: "{{ $labels.container_label_com_docker_compose_project }}"
        annotations:
          summary: "{{ $labels.name }} is not running"
          description: "Container {{ $labels.name }} ({{ $labels.container_label_com_docker_compose_project }}) was last seen {{ $value | humanizeDuration }} ago."

      # An interrupted Compose recreate (two deployers racing) leaves a running container named
      # <id>_<name>; cAdvisor and Loki series then split. Compose's own recreates hold the name
      # for seconds. Fix: recreate the service through doco-cd's REST API (README).
      - alert: ContainerLeftoverName
        expr: container_leftover_name == 1
        for: 10m
        labels:
          tier: warning
        annotations:
          summary: "{{ $labels.container }} kept a temporary Compose name"
          description: "{{ $labels.container }} ({{ $labels.stack }}/{{ $labels.service }}) has been running under Compose's temporary name for 10 minutes; recreate {{ $labels.service }}."

      # The exporter answers but the Docker API behind docker-socket-proxy does not (proxy down, or
      # rejecting its /v1.44 calls). The exporter being down is TargetDown's job; the proxy being
      # down is ContainerDown's, which inhibits this (alertmanager).
      - alert: ContainerHealthExporterBlind
        expr: container_health_up == 0
        for: 5m
        labels:
          tier: warning
          name: docker-socket-proxy
        annotations:
          summary: container-health-exporter cannot read the Docker API
          description: "container-health-exporter has not read the Docker API through docker-socket-proxy for 5 minutes; Uptime of Services that are not Exposed Services and ContainerLeftoverName are blind."

      - alert: ContainerRestarting
        expr: |
          sum by (name, container_label_tier, container_label_com_docker_compose_project) (
            changes(container_start_time_seconds{container_label_tier=~"critical|warning"}[15m])
          ) > 2
        labels:
          tier: "{{ $labels.container_label_tier }}"
          stack: "{{ $labels.container_label_com_docker_compose_project }}"
        annotations:
          summary: "{{ $labels.name }} is restarting repeatedly"
          description: "Container {{ $labels.name }} started {{ $value }} times in 15 minutes."

      # The kernel killed a process in the container for exceeding its memory limit (the Baseline
      # sets one on every Service, ADR 0007). Fires at the Service's Tier even when the container
      # survives, e.g. when only a worker process was killed. Raise the limit or find the leak.
      - alert: ContainerOOMKilled
        expr: |
          sum by (name, container_label_tier, container_label_com_docker_compose_project) (
            increase(container_oom_events_total{container_label_tier=~"critical|warning"}[15m])
          ) > 0
        labels:
          tier: "{{ $labels.container_label_tier }}"
          stack: "{{ $labels.container_label_com_docker_compose_project }}"
        annotations:
          summary: "{{ $labels.name }} was OOM-killed"
          description: "The kernel killed a process in {{ $labels.name }} for exceeding its memory limit in the last 15 minutes."

      # Only meaningful once a container has a memory limit.
      - alert: ContainerMemoryNearLimit
        expr: |
          max by (name, container_label_com_docker_compose_project) (
            container_memory_working_set_bytes{container_label_tier=~"critical|warning"}
              / (container_spec_memory_limit_bytes > 0)
          ) > 0.9
        for: 15m
        labels:
          tier: warning
          stack: "{{ $labels.container_label_com_docker_compose_project }}"
        annotations:
          summary: "{{ $labels.name }} is near its memory limit"
          description: "{{ $labels.name }} is using {{ $value | humanizePercentage }} of its memory limit."

  # The IdP outpost (edge) behind every Protected Service's web UI (ADR 0006). Critical: when it
  # breaks, those web UIs fail closed for everyone. The IdP's own health is DependencyDown (to=idp).
  - name: idp
    rules:
      # The outpost lost its connection to the IdP. Inhibited by DependencyDown{to="idp"}.
      - alert: IdpOutpostDisconnected
        expr: authentik_outpost_connection == 0
        for: 5m
        annotations:
          summary: The IdP outpost has lost the IdP
          description: "idp-outpost has had no connection to the IdP for 5 minutes; it cannot pick up provider changes and sign-ins may fail."

      # Every Protected Service's web UI fails its probe-idp Probe at once: the outpost (or the
      # forward-auth middleware) is broken, not one Service. Inhibits those ProbeFailed alerts and
      # is inhibited by InternetDown or Traefik's own ProbeFailed (alertmanager).
      - alert: IdpForwardAuthFailing
        expr: count(probe_success{job="probe-idp"} == 0) == count(probe_success{job="probe-idp"})
        for: 3m
        labels:
          tier: critical
          stack: edge
          container: idp-outpost
        annotations:
          summary: Protected Services are not redirecting to the IdP
          description: "Every probe-idp Probe has failed for 3 minutes; forward auth through idp-outpost is broken."

      # Forward auth adds this to every request to a Protected web UI. At least 20 requests in
      # 10 minutes, so a handful of slow Probes do not count.
      - alert: IdpOutpostSlow
        expr: |
          histogram_quantile(0.95, sum by (le, container, stack, tier) (rate(authentik_outpost_proxy_request_duration_seconds_bucket[10m]))) > 2
          and sum by (container, stack, tier) (rate(authentik_outpost_proxy_request_duration_seconds_count[10m])) * 600 >= 20
        for: 15m
        annotations:
          summary: The IdP outpost is slow
          description: "95th percentile forward-auth latency through idp-outpost has been {{ $value | humanizeDuration }} for 15 minutes."

  - name: datastores
    rules:
      # The Datastore stopped answering its exporter. Fires at the Datastore's Tier, not the
      # exporter's (info). `name` matches ContainerDown, which inhibits it (alertmanager).
      - alert: DatastoreDown
        expr: label_replace(mysql_up == 0, "name", "$1", "datastore", "(.+)")
        for: 2m
        labels:
          tier: critical
        annotations:
          summary: "{{ $labels.datastore }} is not answering"
          description: "mysqld_exporter ({{ $labels.container }}) cannot query {{ $labels.datastore }} for 2 minutes."

  - name: usenet
    rules:
      # Usenet providers are External Dependencies of SABnzbd (GLOSSARY.md), read from its
      # `mode=status` API by sabnzbd-status-exporter. Disabled servers are ignored.
      - alert: UsenetServerError
        expr: sabnzbd_usenet_server_error == 1 and on(server) sabnzbd_usenet_server_active == 1
        for: 15m
        labels:
          tier: warning
        annotations:
          summary: "Usenet server {{ $labels.server }} is failing"
          description: "SABnzbd has reported an error for {{ $labels.server }} for 15 minutes; see sabnzbd_usenet_server_error_info."

      - alert: UsenetServerWarning
        expr: sabnzbd_usenet_server_warning == 1 and on(server) sabnzbd_usenet_server_active == 1
        for: 1h
        labels:
          tier: warning
        annotations:
          summary: "Usenet server {{ $labels.server }} has a warning"
          description: "SABnzbd has reported a warning for {{ $labels.server }} for an hour; see sabnzbd_usenet_server_warning_info."

      # The exporter answers but SABnzbd's API does not (e.g. a rotated API key). SABnzbd being
      # down is ProbeFailed/ContainerDown's job.
      - alert: SabnzbdStatusDown
        expr: sabnzbd_status_up == 0
        for: 10m
        labels:
          tier: warning
        annotations:
          summary: SABnzbd status API is not answering the exporter
          description: "sabnzbd-status-exporter cannot read api?mode=status for 10 minutes; Usenet server alerts are blind."

  - name: arr
    rules:
      # A Sonarr/Radarr health check (System > Status), e.g. a download client or indexer it
      # cannot reach. UpdateCheck is excluded: Renovate handles updates. `to` names the
      # Dependency behind the check so DependencyDown inhibits it (alertmanager).
      - alert: ArrHealthIssue
        expr: |
          label_replace(label_replace(
            max without (url, wikiurl) (
              label_replace({__name__=~"(sonarr|radarr)_system_health_issues", source!="UpdateCheck"},
                "app", "$1", "__name__", "(sonarr|radarr)_system_health_issues")
            ) == 1,
          "to", "nzbhydra2", "source", "Indexer.*"), "to", "sabnzbd", "source", "DownloadClient.*")
        for: 30m
        labels:
          tier: warning
        annotations:
          summary: "{{ $labels.app }}: {{ $labels.source }}"
          description: "{{ $labels.app }} has reported a {{ $labels.type }} for 30 minutes: {{ $labels.message }}"

      # A queue item that has not imported (or is flagged) for 2 hours: importBlocked,
      # importPending, failedPending, or status warning/error. See arr_queue_item_info.
      - alert: ArrImportStuck
        expr: arr_queue_item_stuck == 1
        for: 2h
        labels:
          tier: warning
        annotations:
          summary: "{{ $labels.app }}: {{ $labels.title }} is stuck in the queue"
          description: "{{ $labels.title }} has needed attention in {{ $labels.app }}'s queue (Activity > Queue) for 2 hours."

      - alert: ArrQueueDown
        expr: arr_queue_up == 0
        for: 10m
        labels:
          tier: warning
        annotations:
          summary: "{{ $labels.container }} cannot read {{ $labels.app }}'s queue"
          description: "{{ $labels.app }}'s queue API has not answered for 10 minutes; ArrImportStuck is blind."

  - name: host
    rules:
      # TrueNAS native alerts are the first line for pool and disk health; this is the second.
      - alert: ZpoolNotOnline
        expr: node_zfs_zpool_state{state!="online"} > 0
        for: 1m
        labels:
          tier: critical
          stack: host
        annotations:
          summary: "ZFS pool {{ $labels.zpool }} is {{ $labels.state }}"

      - alert: HostOutOfMemory
        expr: node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"} < 0.05
        for: 5m
        labels:
          tier: warning
          stack: host
        annotations:
          summary: Host memory is nearly exhausted
          description: "Only {{ $value | humanizePercentage }} of memory is available."

      - alert: HostConntrackNearLimit
        expr: node_nf_conntrack_entries{job="node-exporter"} / node_nf_conntrack_entries_limit{job="node-exporter"} > 0.75
        for: 5m
        labels:
          tier: warning
          stack: host
        annotations:
          summary: Host conntrack table is {{ $value | humanizePercentage }} full

      - alert: HostClockNotSynchronising
        expr: min_over_time(node_timex_sync_status{job="node-exporter"}[5m]) == 0 and node_timex_maxerror_seconds{job="node-exporter"} >= 16
        for: 10m
        labels:
          tier: warning
          stack: host
        annotations:
          summary: Host clock is not synchronising

  - name: deploys
    rules:
      # doco-cd retries a failed Deploy on every poll (2 min). One failure that a retry fixes is
      # already reported to Discord; two or more in 10 minutes means the Stack is stuck.
      - alert: DeployFailing
        expr: sum by (deployment) (increase(doco_cd_deployment_errors_total[10m])) >= 2
        labels:
          tier: warning
          stack: "{{ $labels.deployment }}"
        annotations:
          summary: "Deploys of {{ $labels.deployment }} keep failing"
          description: "doco-cd failed to deploy {{ $labels.deployment }} {{ $value | humanize }} times in 10 minutes."

      # Without polls, merged changes never reach the Host.
      - alert: DeployPollFailing
        expr: sum(increase(doco_cd_poll_errors_total[15m])) >= 3
        labels:
          tier: warning
          stack: doco-cd
        annotations:
          summary: doco-cd cannot poll the repository
          description: "{{ $value | humanize }} polls of the repository failed in 15 minutes."

  - name: backups
    rules:
      # stack-back writes one snapshot of all volumes plus one per database dump. Snapshot
      # groups carry the container hostname (changes on every recreate) and the exact path list
      # (changes whenever a volume is added or removed). Retention keeps superseded groups for
      # years, so group by kind (volumes or databases) rather than by path or hostname.
      - alert: BackupStale
        expr: |
          time() - max by (kind) (
            label_replace(restic_backup_timestamp, "kind", "$1", "snapshot_paths", "^/(volumes|databases).*")
          ) > 26 * 3600
        labels:
          tier: critical
          stack: ops
        annotations:
          summary: "No {{ $labels.kind }} backup in over 26h"
          description: "The newest restic snapshot of {{ $labels.kind }} is {{ $value | humanizeDuration }} old."

      - alert: BackupMetricsMissing
        expr: absent(restic_backup_timestamp)
        for: 3h
        labels:
          tier: critical
          stack: ops
        annotations:
          summary: Backup freshness is unknown
          description: The restic exporter has reported no snapshots for 3 hours, so BackupStale cannot fire.

      # backup-coverage expects every volume and database stack-back is labelled to back up,
      # from Docker (stopped containers too). "Due" waits for the first backup after a recreate.
      - alert: BackupVolumeMissing
        # An empty volume is expected to back up empty (volume_bytes 0).
        expr: |
          backup_coverage_entries == 0
            and on (path) backup_coverage_due == 1
            and on (path) backup_coverage_volume_bytes != 0
        labels:
          tier: warning
          stack: "{{ $labels.project }}"
        annotations:
          summary: "{{ $labels.service }} volume missing from the newest backup"
          description: "{{ $labels.path }} is missing or empty in the newest /volumes snapshot, but the volume holds data."

      - alert: BackupDatabaseStale
        expr: |
          time() - backup_coverage_snapshot_timestamp{kind="database"} > 26 * 3600
            and on (path) backup_coverage_due == 1
        labels:
          tier: warning
          stack: "{{ $labels.project }}"
        annotations:
          summary: "No {{ $labels.service }} database backup in over 26h"
          description: "The newest snapshot of {{ $labels.path }} is {{ $value | humanizeDuration }} old (or there is none)."

      - alert: BackupCoverageUnknown
        expr: |
          time() - backup_coverage_last_success_timestamp > 3 * 3600
            or absent(backup_coverage_last_success_timestamp)
        for: 3h
        labels:
          tier: warning
          stack: monitoring
        annotations:
          summary: Backup coverage is unknown
          description: backup-coverage has not completed a check for 3 hours, so BackupVolumeMissing and BackupDatabaseStale cannot fire.
