# MONITORING STACK (deployed by doco-cd)
## With thanks to https://github.com/ruanbekker/docker-monitoring-stack-gpnc

networks:
  # Internal traffic between monitoring Services stays on the Stack's default network.
  # Prometheus and the exporters of other Stacks (ADR-0002). This Stack owns it.
  metrics:
    name: metrics
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
  # Traefik and the Exposed Services it routes to.
  proxy:
    name: proxy
    external: true

include:
  - ./alertmanager/service.yaml
  - ./alloy/service.yaml
  - ./backup-coverage/service.yaml
  - ./blackbox-exporter/service.yaml
  - ./cadvisor/service.yaml
  - ./container-health-exporter/service.yaml
  - ./dcgm-exporter/service.yaml
  - ./docker-socket-proxy/service.yaml
  - ./grafana/service.yaml
  - ./loki/service.yaml
  - ./node-exporter/service.yaml
  - ./prometheus/service.yaml
  - ./restic-exporter/service.yaml
