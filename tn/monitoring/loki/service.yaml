# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  loki:
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    container_name: loki
    user: ${MONITORING_UID}:${MONITORING_GID}
    deploy:
      resources:
        limits:
          # 30-day peak 467M working set
          memory: 768M
    command: -config.file=/etc/loki/loki.yaml
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "1"
      baseline.exempt.healthcheck: "distroless image: no shell, wget or curl to run a healthcheck with"
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      # nocopy: otherwise Docker copies the image's /loki (owned 10001) onto the empty volume
      - type: volume
        source: loki_data
        target: /loki
        volume:
          nocopy: true
    networks:
      - default

volumes:
  # Logs are not backed up (no stack-back label); 14d retention.
  loki_data:
    name: monitoring_loki_data
    external: true
