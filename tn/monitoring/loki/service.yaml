# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  loki:
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    container_name: loki
    user: ${MONITORING_UID}:${MONITORING_GID}
    deploy:
      resources:
        limits:
          # 30-day peak 467M working set
          memory: 768M
    command: -config.file=/etc/loki/loki.yaml
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "1"
      baseline.exempt.healthcheck: "distroless image: no shell, wget or curl to run a healthcheck with"
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      # nocopy: otherwise Docker copies the image's /loki (owned 10001) onto the empty volume
      - type: volume
        source: loki_data
        target: /loki
        volume:
          nocopy: true
    networks:
      - default

volumes:
  # Logs are not backed up (no stack-back label); 14d retention.
  loki_data:
    name: monitoring_loki_data
    external: true
