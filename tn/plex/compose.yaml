services:
  plex:
    # https://github.com/home-operations/containers/pkgs/container/plex
    # https://github.com/plexinc/pms-docker
    extends:
      file: ../_baseline.yaml
      service: baseline
    image: ghcr.io/home-operations/plex:1.43.4@sha256:fdc6fe82bc7d8acd08fc0aa581fcb76722803ba5905e2537135a697347dd6149
    container_name: plex
    user: ${PLEX_UID}:${MEDIA_SHARED_GID}
    group_add:
      - 107 # render
      - 44 # video
    # /identity answers once the server is accepting requests; the exporter waits for it.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:32400/identity"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      - TZ=${TZ}

      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "plex_config"
      
      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.plex-http.rule: Host(`plex.${DOMAIN}`)
      traefik.http.routers.plex-http.entrypoints: http
      traefik.http.routers.plex-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.plex-https.rule: Host(`plex.${DOMAIN}`)
      traefik.http.routers.plex-https.entrypoints: https
      traefik.http.routers.plex-https.tls: true
      traefik.http.routers.plex-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.plex-https.service: plex
      traefik.http.routers.plex-https.middlewares: crowdsec-bouncer

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://plex.${DOMAIN}/identity
      # plex.<domain> is DNS-only (the WAN address); proxied names don't carry raw TCP
      probe.tcp: plex.${DOMAIN}:32400

      traefik.http.services.plex.loadbalancer.server.port: 32400
    ports:
      - 32400:32400 # http
      - 32410:32410/udp # gdm-udp0
      - 32412:32412/udp # gdm-udp1
      - 32413:32413/udp # gdm-udp2
      - 32414:32414/udp # gdm-udp3
    volumes:
      - plex_config:/config
      - plex_transcode:/transcode
      - ${ZFS_POOL_ROOT_HDD}/media:/data:ro
      - ${ZFS_POOL_ROOT_HDD}/media/plex_recordings:/recordings
    networks:
      - default
      - proxy
    deploy:
      resources:
        limits:
          # 30-day peak 634M
          memory: 1G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  plex-exporter:
    # https://github.com/jsclayton/prometheus-plex-exporter
    extends:
      file: ../_baseline.yaml
      service: baseline
    image: ghcr.io/jsclayton/prometheus-plex-exporter:latest@sha256:18ef1b2197efbcb75bd7276380955760995f10a9fbe55106809a6fcff91c2940
    container_name: plex-exporter
    user: ${MEDIA_UID}:${MEDIA_GID}
    deploy:
      resources:
        limits:
          # 30-day peak 27M
          memory: 64M
    # The exporter exits if Plex is not answering yet. At boot dockerd ignores depends_on,
    # so wait for Plex here rather than crash-looping (doco-cd refuses restarting containers).
    entrypoint: ["sh", "-c", "until wget -qO /dev/null \"$$PLEX_SERVER/identity\"; do sleep 5; done; exec /prometheus-plex-exporter"]
    depends_on:
      plex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9000/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      # https://github.com/jsclayton/prometheus-plex-exporter?tab=readme-ov-file#configuration
      - PLEX_SERVER=http://plex:32400
      - PLEX_TOKEN=${PLEX_EXPORTER_TOKEN}
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: info
      startup-order: "3"
    networks:
      - default
      - metrics

volumes:
  plex_config:
    name: media_plex_config
    external: true
  plex_transcode:
    name: media_plex_transcode
    external: true

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
  # Prometheus and exporters; owned by the monitoring Stack (ADR-0002).
  metrics:
    name: metrics
    external: true
