services:
  emby:
    # https://hub.docker.com/r/emby/embyserver
    # https://github.com/MediaBrowser/Emby.Releases/releases
    extends:
      file: ../_baseline.yaml
      service: baseline
    image: emby/embyserver:4.9.5.0@sha256:734a6f03c7c783a9e566b08d09a2b6376f41229ff29f032a7e00302e0be98f8a
    container_name: emby
    # The image's s6 run script only chowns /config and s6-applyuidgid's to UID/GID, which needs
    # caps; start EmbyServer as that user instead (same args), so no caps. init reaps ffmpeg children.
    user: ${EMBY_UID}:${MEDIA_SHARED_GID}
    init: true
    entrypoint: ["/system/EmbyServer", "-programdata", "/config", "-ffdetect", "/bin/ffdetect", "-ffmpeg", "/bin/ffmpeg", "-ffprobe", "/bin/ffprobe", "-restartexitcode", "3"]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:32800/emby/System/Ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 5s
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "emby_config"
      
      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.emby-http.rule: Host(`emby.${DOMAIN}`)
      traefik.http.routers.emby-http.entrypoints: http
      traefik.http.routers.emby-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.emby-https.rule: Host(`emby.${DOMAIN}`)
      traefik.http.routers.emby-https.entrypoints: https
      traefik.http.routers.emby-https.tls: true
      traefik.http.routers.emby-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.emby-https.service: emby
      traefik.http.routers.emby-https.middlewares: crowdsec-bouncer

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://emby.${DOMAIN}/emby/System/Ping

      traefik.http.services.emby.loadbalancer.server.port: 32800
    ports:
      - 32800:32800 # http
      - 32900:32900 # https
    volumes:
      - emby_config:/config
      # Media mounts never create their source (ADR 0009): a missing folder fails the Deploy
      # instead of becoming a root-owned empty folder.
      # Media Server: reads the Libraries it presents at the same container paths as before (no
      # rescan) and organizes only its recordings Library.
      - type: bind
        source: ${ZFS_POOL_ROOT_HDD}/media/tv/library
        target: /data/tv
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ZFS_POOL_ROOT_HDD}/media/movies/library
        target: /data/movies
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ZFS_POOL_ROOT_HDD}/media/emby_recordings
        target: /recordings
        bind:
          create_host_path: false
    networks:
      - default
      - proxy
    deploy:
      resources:
        limits:
          # 30-day peak 7.8G
          memory: 12G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  emby_config:
    name: media_emby_config
    external: true

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
