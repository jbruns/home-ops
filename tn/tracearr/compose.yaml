services:
  tracearr:
    # https://github.com/connorgallopo/Tracearr/pkgs/container/tracearr
    # https://github.com/connorgallopo/tracearr
    extends:
      file: ../_baseline.yaml
      service: baseline
    image: ghcr.io/connorgallopo/tracearr:supervised-1.4.27@sha256:9948e47a12f3c7fb38c20a48aab1e3f68c5ba8a045a5eee4174db21f05f9d14a
    container_name: tracearr
    shm_size: 512mb  # Required for PostgreSQL shared memory (increase for large imports)
    deploy:
      resources:
        limits:
          # Image minimum is 3GB (PostgreSQL + Redis + Node.js); 30-day peak 714M working set
          memory: 3G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536  # TimescaleDB chunks require many file descriptors
    # Supervised image: entrypoint chowns/chmods data dirs as root, then gosu/supervisord drop to
    # postgres, redis and tracearr users; it cannot start as a single non-root user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 5s
    environment:
      - TZ=${TZ}
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: info
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "tracearr_postgres,tracearr_redis,tracearr_data,tracearr_backups"
      
      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.tracearr-http.rule: Host(`tracearr.${DOMAIN}`)
      traefik.http.routers.tracearr-http.entrypoints: http
      traefik.http.routers.tracearr-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.tracearr-https.rule: Host(`tracearr.${DOMAIN}`)
      traefik.http.routers.tracearr-https.entrypoints: https
      traefik.http.routers.tracearr-https.tls: true
      traefik.http.routers.tracearr-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.tracearr-https.service: tracearr
      traefik.http.routers.tracearr-https.middlewares: crowdsec-bouncer

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://tracearr.${DOMAIN}/health

      traefik.http.services.tracearr.loadbalancer.server.port: 3000
    volumes:
      - tracearr_postgres:/data/postgres
      - tracearr_redis:/data/redis
      - tracearr_data:/data/tracearr
      - tracearr_backups:/data/backup    
    networks:
      - default
      - proxy

volumes:
  tracearr_postgres:
    name: media_tracearr_postgres
    external: true
  tracearr_redis:
    name: media_tracearr_redis
    external: true
  tracearr_data:
    name: media_tracearr_data
    external: true
  tracearr_backups:
    name: media_tracearr_backups
    external: true

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
