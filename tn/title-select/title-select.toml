# Title Select's configuration; keys as in its README for the pinned version.

[roots.sources]
path = "/sources"
writable = false
# Source Sets that repairs may write; each is bound read-write on its own (compose.yaml).
writable_paths = ["No-Intro/Atari - Atari 2600", "No-Intro/Nintendo - Game Boy Advance", "Redump/Sony - PlayStation (America)"]

# Library Folders, each bind-mounted on its own under /play (compose.yaml).
[roots.play]
path = "/play"
writable = true

# The Ingest Folder, where new files arrive; assessed when you scan it.
[roots.ingest]
path = "/ingest"
writable = true
kind = "ingest"

# The additions sets, one folder per system.
[roots.additions]
path = "/additions"
writable = true

[audits]
keep = 20

[auth]
identity_header = "X-authentik-username"
# Traefik's static address on `proxy` (tn/edge), the only peer that may set the header.
trusted_proxies = ["172.30.0.10/32"]

[jobs]
concurrent = 1
pace = "gentle"

[selections]
keep = 20

# Fetch newer DATs, cue packs and SBI packs from Redump for the systems a Source Set follows: each at most once a
# day per system. Never No-Intro.
[fetch]
redump = true