services:
  crowdsec:
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: crowdsecurity/crowdsec:v1.7.8@sha256:2f527c9bb8b367120eb08b82890aa912ce96bfa1ada93dda0721700e4b4e0dde
    container_name: crowdsec
    user: ${COMMON_UID}:${COMMON_GID}
    deploy:
      resources:
        limits:
          # 30-day peak 219M working set
          memory: 384M
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      # https://hub.docker.com/r/crowdsecurity/crowdsec
      - TZ=${TZ}
      # https://app.crowdsec.net/hub/collections
      # Reinstalled on every start, so a hub refresh cannot leave dangling links behind.
      # linux is the image's default base collection; whitelists (private IPs) left it.
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/traefik crowdsecurity/http-cve
      - PARSERS=crowdsecurity/whitelists
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: critical
      startup-order: "0"
      stack-back.volumes: true
      stack-back.volumes.include: "crowdsec_data,crowdsec_config"

    volumes:
      - crowdsec_log:/var/log/crowdsec
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
      # Home public addresses never get banned; only this Host's CrowdSec carries them
      - type: bind
        source: ./home-whitelist.sops.yaml
        target: /etc/crowdsec/parsers/s02-enrich/home-whitelist.yaml
        read_only: true
        x-sops: true
      # Allow Crowdsec to read and parse Traefik access logs
      - traefik_log:/var/log/traefik:ro
    networks:
      - default
      - metrics

volumes:
  crowdsec_log:
    name: common_crowdsec_log
    external: true
  crowdsec_config:
    name: common_crowdsec_config
    external: true
  crowdsec_data:
    name: common_crowdsec_data
    external: true
