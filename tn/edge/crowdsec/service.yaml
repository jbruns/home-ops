# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  crowdsec:
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    container_name: crowdsec
    user: ${COMMON_UID}:${COMMON_GID}
    deploy:
      resources:
        limits:
          # 30-day peak 219M working set
          memory: 384M
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      # https://hub.docker.com/r/crowdsecurity/crowdsec
      - TZ=${TZ}
      # https://app.crowdsec.net/hub/collections
      # Reinstalled on every start, so a hub refresh cannot leave dangling links behind.
      # linux is the image's default base collection; whitelists (private IPs) left it.
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/traefik crowdsecurity/http-cve
      - PARSERS=crowdsecurity/whitelists
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: critical
      startup-order: "0"
      stack-back.volumes: true
      stack-back.volumes.include: "crowdsec_data,crowdsec_config"

    volumes:
      - crowdsec_log:/var/log/crowdsec
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
      # Home public addresses never get banned; only this Host's CrowdSec carries them.
      # Alloy's monitoring/alloy/home-clients.sops.env holds the same addresses as a regex.
      - type: bind
        source: ./home-whitelist.sops.yaml
        target: /etc/crowdsec/parsers/s02-enrich/home-whitelist.yaml
        read_only: true
        x-sops: true
      # Allow Crowdsec to read and parse Traefik access logs
      - traefik_log:/var/log/traefik:ro
    networks:
      - default
      - metrics

volumes:
  crowdsec_log:
    name: edge_crowdsec_log
    labels:
      homeops.regenerable: "crowdsec logs to stdout (log_media: stdout); nothing is written here"
  crowdsec_config:
    name: edge_crowdsec_config
    external: true
  crowdsec_data:
    name: edge_crowdsec_data
    external: true
