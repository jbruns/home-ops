# EDGE STACK (deployed by doco-cd)
# Ingress: Traefik (ports 80/443), the CrowdSec engine behind its bouncer, nginx for
# error pages and the catch-all route, and the IdP outpost behind Protected Services' forward auth.

networks:
  # Traefik and the Exposed Services it routes to; owned here (ADR-0002).
  proxy:
    name: proxy
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Dynamic addresses come from the upper half only, so Traefik's static
          # 172.30.0.10 can never be handed to another container.
          ip_range: 172.30.0.128/25
  # Prometheus and exporters; owned by the monitoring Stack.
  metrics:
    name: metrics
    external: true

include:
  - ./crowdsec/service.yaml
  - ./idp-outpost/service.yaml
  - ./nginx/service.yaml
  - ./traefik/service.yaml
