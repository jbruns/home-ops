# EDGE STACK (deployed by doco-cd)
# Ingress: Traefik (ports 80/443), the CrowdSec engine behind its bouncer, and nginx for
# error pages and the catch-all route.

networks:
  # Traefik and the Exposed Services it routes to; owned here (ADR-0002).
  proxy:
    name: proxy
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Dynamic addresses come from the upper half only, so Traefik's static
          # 172.30.0.10 can never be handed to another container.
          ip_range: 172.30.0.128/25
  # Prometheus and exporters; owned by the monitoring Stack.
  metrics:
    name: metrics
    external: true

include:
  - ./crowdsec/docker-compose.yaml
  - ./nginx/docker-compose.yaml
  - ./traefik/docker-compose.yaml
