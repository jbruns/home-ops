services:
  vaultwarden:
    # https://hub.docker.com/r/vaultwarden/server
    image: vaultwarden/server:1.37.2
    restart: unless-stopped
    dns_search: .
    container_name: vaultwarden
    user: ${HOME_UID}:${HOME_GID}
    security_opt:
      - no-new-privileges=true
    environment:
      # https://github.com/dani-garcia/vaultwarden/blob/main/.env.template
      - DOMAIN=https://vault.${ALT_DOMAIN_HOME}
      - HELO_NAME=vault.${ALT_DOMAIN_HOME}
      - SMTP_FROM=${VAULTWARDEN_SMTP_FROM}
      - SMTP_HOST=${VAULTWARDEN_SMTP_HOST}
      - SMTP_USERNAME=${VAULTWARDEN_SMTP_USERNAME}
    # ADMIN_TOKEN (argon2 hash, single-quoted so Compose does not interpolate its $),
    # DATABASE_URL and SMTP_PASSWORD. doco-cd decrypts the file; Compose reads it as an env_file.
    # https://github.com/dani-garcia/vaultwarden/wiki/Enabling-admin-page#secure-the-admin_token
    env_file: ./vaultwarden.sops.env
    depends_on:
      vaultwarden-db:
        condition: service_healthy
        restart: true
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: critical
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "vaultwarden_data"
      
      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.vaultwarden-http.rule: Host(`vault.${ALT_DOMAIN_HOME}`)
      traefik.http.routers.vaultwarden-http.entrypoints: http
      traefik.http.routers.vaultwarden-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.vaultwarden-https.rule: Host(`vault.${ALT_DOMAIN_HOME}`)
      traefik.http.routers.vaultwarden-https.entrypoints: https
      traefik.http.routers.vaultwarden-https.tls: true
      traefik.http.routers.vaultwarden-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.vaultwarden-https.service: vaultwarden
      traefik.http.routers.vaultwarden-https.middlewares: vaultwarden-chain

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://vault.${ALT_DOMAIN_HOME}/alive

      # Headers middleware (https://github.com/dani-garcia/vaultwarden/wiki/Proxy-examples)
      traefik.http.middlewares.vaultwarden-headers.headers.stsSeconds: 31536000
      traefik.http.middlewares.vaultwarden-headers.headers.customBrowserXSSValue: 0
      traefik.http.middlewares.vaultwarden-headers.headers.customFrameOptionsValue: SAMEORIGIN
      traefik.http.middlewares.vaultwarden-headers.headers.contentTypeNosniff: true
      traefik.http.middlewares.vaultwarden-headers.headers.customResponseHeaders.X-Robots-Tag: 'noindex,nofollow'

      # Chain all Vaultwarden middlewares together
      traefik.http.middlewares.vaultwarden-chain.chain.middlewares: crowdsec-bouncer, vaultwarden-headers
      
      traefik.http.services.vaultwarden.loadbalancer.server.port: 80
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        tag: "{{.Name}}"
    volumes:
      - vaultwarden_data:/data
    networks:
      - default
      - proxy

  vaultwarden-db:
    # https://hub.docker.com/_/mariadb
    image: mariadb:11.8.9
    container_name: vaultwarden-db
    restart: unless-stopped
    stop_grace_period: 60s
    dns_search: .
    # Exit 0 whenever the server answers, even "access denied"; no credentials needed.
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/vaultwarden_db_root_password
    # MARIADB_DATABASE/USER/PASSWORD: Vaultwarden's own account (created on first init);
    # stack-back dumps with it too.
    env_file:
      - ./db.sops.env
    secrets:
      - vaultwarden_db_root_password
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: critical
      startup-order: "1"
      stack-back.mariadb: true

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        tag: "{{.Name}}"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - default
      # stack-back (ops) dumps the database over the backup network.
      - backup

  vaultwarden-db-exporter:
    # https://github.com/prometheus/mysqld_exporter
    # Its `exporter` account was created by hand, once (a fresh data volume needs it again):
    #   CREATE USER 'exporter'@'%' IDENTIFIED BY '<DB_EXPORTER_PASSWORD>' WITH MAX_USER_CONNECTIONS 3;
    #   GRANT PROCESS, SLAVE MONITOR ON *.* TO 'exporter'@'%';
    image: prom/mysqld-exporter:v0.20.0
    container_name: vaultwarden-db-exporter
    restart: unless-stopped
    dns_search: .
    security_opt:
      - no-new-privileges=true
    command:
      - --mysqld.address=vaultwarden-db:3306
      - --mysqld.username=exporter
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${DB_EXPORTER_PASSWORD}
    depends_on:
      vaultwarden-db:
        condition: service_healthy
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: info
      startup-order: "3"

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
        tag: "{{.Name}}"
    networks:
      - default
      - metrics

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
  # Prometheus and exporters; owned by the monitoring Stack (ADR-0002).
  metrics:
    name: metrics
    external: true
  # stack-back and the Datastores it dumps; owned by the ops Stack.
  backup:
    name: backup
    external: true

secrets:
  vaultwarden_db_root_password:
    file: ./db_root_password.sops.txt

volumes:
  vaultwarden_data:
    name: home_vaultwarden_data
    external: true
  db_data:
    name: vaultwarden_db_data
    external: true
