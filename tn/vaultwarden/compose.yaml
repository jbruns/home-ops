services:
  vaultwarden:
    # https://hub.docker.com/r/vaultwarden/server
    extends:
      file: ../_baseline.yaml
      service: baseline
    image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
    container_name: vaultwarden
    user: ${HOME_UID}:${HOME_GID}
    # Mirrors the image's own HEALTHCHECK (GET /alive on ROCKET_PORT).
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s
    deploy:
      resources:
        limits:
          # 30-day peak 103M working set
          memory: 160M
    environment:
      # https://github.com/dani-garcia/vaultwarden/blob/main/.env.template
      # Anything saved in the admin page goes to /data/config.json and overrides these (and the
      # env_file); the startup log lists overridden keys. Stale smtp_* there caused #435's 535s.
      - DOMAIN=https://vault.${ALT_DOMAIN_HOME}
      - HELO_NAME=vault.${ALT_DOMAIN_HOME}
      - SMTP_FROM=${VAULTWARDEN_SMTP_FROM}
      - SMTP_HOST=${VAULTWARDEN_SMTP_HOST}
      - SMTP_USERNAME=${VAULTWARDEN_SMTP_USERNAME}
    # ADMIN_TOKEN (argon2 hash, single-quoted so Compose does not interpolate its $),
    # DATABASE_URL and SMTP_PASSWORD. doco-cd decrypts the file; Compose reads it as an env_file.
    # https://github.com/dani-garcia/vaultwarden/wiki/Enabling-admin-page#secure-the-admin_token
    env_file: ./vaultwarden.sops.env
    depends_on:
      mariadb:
        condition: service_healthy
        restart: true
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: critical
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "vaultwarden_data"
      
      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.vaultwarden-http.rule: Host(`vault.${ALT_DOMAIN_HOME}`)
      traefik.http.routers.vaultwarden-http.entrypoints: http
      traefik.http.routers.vaultwarden-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.vaultwarden-https.rule: Host(`vault.${ALT_DOMAIN_HOME}`)
      traefik.http.routers.vaultwarden-https.entrypoints: https
      traefik.http.routers.vaultwarden-https.tls: true
      traefik.http.routers.vaultwarden-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.vaultwarden-https.service: vaultwarden
      traefik.http.routers.vaultwarden-https.middlewares: vaultwarden-chain

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://vault.${ALT_DOMAIN_HOME}/alive

      # Headers middleware (https://github.com/dani-garcia/vaultwarden/wiki/Proxy-examples)
      traefik.http.middlewares.vaultwarden-headers.headers.stsSeconds: 31536000
      traefik.http.middlewares.vaultwarden-headers.headers.customBrowserXSSValue: 0
      traefik.http.middlewares.vaultwarden-headers.headers.customFrameOptionsValue: SAMEORIGIN
      traefik.http.middlewares.vaultwarden-headers.headers.contentTypeNosniff: true
      traefik.http.middlewares.vaultwarden-headers.headers.customResponseHeaders.X-Robots-Tag: 'noindex,nofollow'

      # Chain all Vaultwarden middlewares together
      traefik.http.middlewares.vaultwarden-chain.chain.middlewares: crowdsec-bouncer, vaultwarden-headers
      
      traefik.http.services.vaultwarden.loadbalancer.server.port: 80
    volumes:
      - vaultwarden_data:/data
    networks:
      - default
      - proxy

  mariadb:
    # https://hub.docker.com/_/mariadb
    extends:
      file: ../_baseline.yaml
      service: baseline
    image: mariadb:11.8.9@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
    container_name: vaultwarden-mariadb
    # The image's mysql user; the entrypoint skips its chown + gosu when not root, so no caps.
    user: "999:999"
    deploy:
      resources:
        limits:
          # 30-day peak 230M working set
          memory: 384M
    stop_grace_period: 60s
    # The image's check, via its healthcheck user (.my-healthcheck.cnf in the datadir).
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/vaultwarden_mariadb_root_password
      # root only via the local socket (hops db logs in that way); no root@% on a fresh init.
      - MARIADB_ROOT_HOST=localhost
    # MARIADB_DATABASE/USER/PASSWORD: Vaultwarden's own account (created on first init);
    # stack-back dumps with it too.
    env_file:
      - ./mariadb.sops.env
    secrets:
      - vaultwarden_mariadb_root_password
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: critical
      startup-order: "1"
      stack-back.mariadb: true
      # Expected users, checked by hops db --users (the image's mariadb.sys and healthcheck are implied):
      # root@localhost: admin, local socket only. exporter@%: mysqld-exporter, see mariadb-exporter.
      # vaultwardenuser@%: Vaultwarden's own login; stack-back dumps with it too (mariadb.sops.env).
      homeops.db.users: "root@localhost,exporter@%,vaultwardenuser@%"

    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - default
      # stack-back (ops) dumps the database over the backup network.
      - backup

  mariadb-exporter:
    # https://github.com/prometheus/mysqld_exporter
    # Its `exporter` account was created by hand, once (a fresh data volume needs it again):
    #   CREATE USER 'exporter'@'%' IDENTIFIED BY '<MARIADB_EXPORTER_PASSWORD>' WITH MAX_USER_CONNECTIONS 3;
    #   GRANT PROCESS, SLAVE MONITOR ON *.* TO 'exporter'@'%';
    extends:
      file: ../_baseline.yaml
      service: baseline
    image: prom/mysqld-exporter:v0.21.0@sha256:afad0c59a154fea24ca5ea0e6f95f2b0b168601b111266963dc8a347715b5318
    container_name: vaultwarden-mariadb-exporter
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9104/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    deploy:
      resources:
        limits:
          # 30-day peak 33M working set
          memory: 64M
    command:
      - --mysqld.address=mariadb:3306
      - --mysqld.username=exporter
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${MARIADB_EXPORTER_PASSWORD}
    depends_on:
      mariadb:
        condition: service_healthy
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: info
      startup-order: "3"

    networks:
      - default
      - metrics

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
  # Prometheus and exporters; owned by the monitoring Stack (ADR-0002).
  metrics:
    name: metrics
    external: true
  # stack-back and the Datastores it dumps; owned by the ops Stack.
  backup:
    name: backup
    external: true

secrets:
  vaultwarden_mariadb_root_password:
    file: ./mariadb_root_password.sops.txt

volumes:
  vaultwarden_data:
    name: vaultwarden_data
    external: true
  mariadb_data:
    name: vaultwarden_mariadb_data
    external: true
