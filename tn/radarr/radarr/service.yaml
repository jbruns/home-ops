# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  radarr:
    # https://github.com/home-operations/containers/pkgs/container/radarr
    # https://github.com/Radarr/Radarr
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: ghcr.io/home-operations/radarr:6.4.4@sha256:1902ad2c08e9bac276ff9a1429af2eaa2f3c635a51f138f1b3eb734995171537
    user: ${RADARR_UID}:${MEDIA_SHARED_GID}
    container_name: radarr
    deploy:
      resources:
        limits:
          # 30-day peak 734M working set
          memory: 1280M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7878/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    environment:
      - TZ=${TZ}
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "radarr_config"
      
      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.radarr-http.rule: Host(`radarr.${DOMAIN}`)
      traefik.http.routers.radarr-http.entrypoints: http
      traefik.http.routers.radarr-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.radarr-https.rule: Host(`radarr.${DOMAIN}`)
      traefik.http.routers.radarr-https.entrypoints: https
      traefik.http.routers.radarr-https.tls: true
      traefik.http.routers.radarr-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.radarr-https.service: radarr
      traefik.http.routers.radarr-https.middlewares: crowdsec-bouncer

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://radarr.${DOMAIN}/ping

      traefik.http.services.radarr.loadbalancer.server.port: 7878
    volumes:
      - radarr_config:/config
      # Media mounts never create their source (ADR 0009): a missing folder fails the Deploy
      # instead of becoming a root-owned empty folder.
      # Movies Organizer: the whole Movies tree as one mount, so imports into library/ are renames.
      - type: bind
        source: ${ZFS_POOL_ROOT_HDD}/media/movies
        target: /data/movies
        bind:
          create_host_path: false
    networks:
      - default
      - downloads
      - proxy

  radarr-exporter:
    # https://github.com/onedr0p/exportarr
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
    container_name: radarr-exporter
    user: ${MEDIA_UID}:${MEDIA_GID}
    deploy:
      resources:
        limits:
          # 30-day peak 95M working set
          memory: 192M
    depends_on:
      radarr:
        condition: service_healthy
    command: ["radarr"]
    environment:
      # https://github.com/onedr0p/exportarr#configuration
      - PORT=9708
      - URL=http://radarr:7878
      - APIKEY=${RADARR_API_KEY}
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: info
      startup-order: "3"
      # exportarr is distroless: no shell, wget or health subcommand to run a healthcheck with.
      baseline.exempt.healthcheck: "distroless image: no shell or health subcommand"
    networks:
      - default
      - metrics

  radarr-queue-exporter:
    # Stuck Radarr queue items (failed imports) for Prometheus: arr_queue_* with app="radarr".
    # Source: components/arr-queue-exporter in the Repo Tooling repo.
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: ghcr.io/jbruns/arr-queue-exporter:1.0.0@sha256:9846d925a879f020205b87379ca44f4d4e5d8e1db08a7cebdfcf0ec88dba9df9
    container_name: radarr-queue-exporter
    user: ${MEDIA_UID}:${MEDIA_GID}
    deploy:
      resources:
        limits:
          # No 30-day peak yet; the script watching both apps peaked at 17M. Re-measure and resize.
          memory: 64M
    read_only: true
    depends_on:
      radarr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "-m", "arr_queue_exporter", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    environment:
      - ARR_URL=http://radarr:7878
      - ARR_API_KEY=${RADARR_API_KEY}
      - ARR_APP=radarr
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: info
      startup-order: "3"
    networks:
      - default
      - metrics

volumes:
  radarr_config:
    name: radarr_config
    external: true