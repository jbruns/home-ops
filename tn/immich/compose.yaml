# IMMICH STACK (deployed by doco-cd)
# Immich (photo and video library) with its Datastores, whose containers are named immich-<service>
# (ADR 0010). Startup order: postgres and valkey healthy, then immich-server and immich-machine-learning.
# Versions and settings follow Immich's release docker-compose.yml, hwaccel.transcoding.yml (nvenc)
# and hwaccel.ml.yml (cuda); the server and machine learning images move together (renovate.json).

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
  # Prometheus and exporters; owned by the monitoring Stack (ADR-0002).
  metrics:
    name: metrics
    external: true
  # stack-back and the Datastores it dumps; owned by the ops Stack.
  backup:
    name: backup
    external: true

include:
  - ./postgres/service.yaml
  - ./valkey/service.yaml
  - ./immich-server/service.yaml
  - ./immich-machine-learning/service.yaml
