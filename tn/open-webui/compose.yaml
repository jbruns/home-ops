services:
  ollama:
    # https://hub.docker.com/r/ollama/ollama/tags
    # https://github.com/ollama/ollama/blob/main/envconfig/config.go#L233
    extends:
      file: ../_baseline.yaml
      service: baseline
    image: ollama/ollama:0.40.9@sha256:5c6707fcf2e1a30cffe2ecb7e315584fc87747c389327e4bc711c4959aa1eecc
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    container_name: ollama
    # https://github.com/ollama/ollama/issues/6543
    # user: ${HOME_UID}:${HOME_GID}
    environment:
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_CONTEXT_LENGTH=128000
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: info
      startup-order: "1"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - default
    deploy:
      resources:
        limits:
          # 30-day peak 668M working set; headroom for model loads
          memory: 2G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  
  open-webui:
    # https://github.com/open-webui/open-webui/pkgs/container/open-webui
    # https://github.com/open-webui/open-webui
    extends:
      file: ../_baseline.yaml
      service: baseline
    image: ghcr.io/open-webui/open-webui:v0.11.3@sha256:41daa0cf2561a5d4c8d1ff31ee2a98d93ab4d3ac2605cac69366ff6a3374a933
    depends_on:
      ollama:
        condition: service_healthy
    # Mirrors the image HEALTHCHECK so Compose owns it.
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:8080/health | jq -ne 'input.status == true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    container_name: open-webui
    deploy:
      resources:
        limits:
          # 30-day peak 703M working set
          memory: 1536M
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "open-webui_data"
      
      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.open-webui-http.rule: Host(`openwebui.${DOMAIN}`)
      traefik.http.routers.open-webui-http.entrypoints: http
      traefik.http.routers.open-webui-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.open-webui-https.rule: Host(`openwebui.${DOMAIN}`)
      traefik.http.routers.open-webui-https.entrypoints: https
      traefik.http.routers.open-webui-https.tls: true
      traefik.http.routers.open-webui-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.open-webui-https.service: open-webui
      traefik.http.routers.open-webui-https.middlewares: crowdsec-bouncer

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://openwebui.${DOMAIN}/health

      traefik.http.services.open-webui.loadbalancer.server.port: 8080
    volumes:
      - open-webui_data:/app/backend/data
    networks:
      - default
      - proxy

volumes:
  ollama_data:
    name: open-webui_ollama_data
    external: true
  open-webui_data:
    name: open-webui_data
    external: true

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
