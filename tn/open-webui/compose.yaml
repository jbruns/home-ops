services:
  ollama:
    # https://hub.docker.com/r/ollama/ollama/tags
    # https://github.com/ollama/ollama/blob/main/envconfig/config.go#L233
    image: ollama/ollama:0.34.3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    dns_search: .
    container_name: ollama
    # https://github.com/ollama/ollama/issues/6543
    # user: ${HOME_UID}:${HOME_GID}
    environment:
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_CONTEXT_LENGTH=128000
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: info
      startup-order: "1"
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 1
        tag: "{{.Name}}"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - default
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  
  open-webui:
    # https://github.com/open-webui/open-webui/pkgs/container/open-webui
    # https://github.com/open-webui/open-webui
    image: ghcr.io/open-webui/open-webui:v0.11.3
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    dns_search: .
    container_name: open-webui
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "open-webui_data"
      
      traefik.enable: true
      traefik.docker.network: proxy

      # Listen on http, but redirect all requests to https
      traefik.http.routers.open-webui-http.rule: Host(`openwebui.${DOMAIN}`)
      traefik.http.routers.open-webui-http.entrypoints: http
      traefik.http.routers.open-webui-http.middlewares: redirect-https

      # Direct all https requests to the service, checking with crowdsec first
      traefik.http.routers.open-webui-https.rule: Host(`openwebui.${DOMAIN}`)
      traefik.http.routers.open-webui-https.entrypoints: https
      traefik.http.routers.open-webui-https.tls: true
      traefik.http.routers.open-webui-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.open-webui-https.service: open-webui
      traefik.http.routers.open-webui-https.middlewares: crowdsec-bouncer

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://openwebui.${DOMAIN}/health

      traefik.http.services.open-webui.loadbalancer.server.port: 8080
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 1
        tag: "{{.Name}}"
    volumes:
      - open-webui_data:/app/backend/data
    networks:
      - default
      - proxy

volumes:
  ollama_data:
    name: home_ollama_data
    external: true
  open-webui_data:
    name: home_open-webui_data
    external: true

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
