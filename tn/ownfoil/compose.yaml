# OWNFOIL STACK (deployed by doco-cd). Moved from asotbz/ops tn/asot-media (#457).
# Hostnames are under this Stack's own DOMAIN, not edge's.
services:
  ownfoil:
    # https://github.com/a1ex4/ownfoil/releases ; Switch clients use its basic auth on every path
    # (#503, docs/research/0503-ownfoil-client-path.md)
    extends:
      file: ../_baseline.yaml
      service: baseline
    image: a1ex4/ownfoil:2.5.0@sha256:123130aad6a260b1eeacf3968b6b56fbf510662034faab2f4cd2da08d967f3f7
    container_name: ownfoil
    # run.sh only adds a user, chowns /app and sudo's to PUID; start the app as that user instead,
    # so no caps. /app/data (TitleDB, rebuilt at start) was chowned by run.sh; it is a tmpfs now.
    user: ${OWNFOIL_UID}:${MEDIA_SHARED_GID}
    entrypoint: ["python", "/app/run.py"]
    tmpfs:
      - /app/data:uid=${OWNFOIL_UID},gid=${MEDIA_SHARED_GID},mode=0755,size=384m
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8465/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    deploy:
      resources:
        limits:
          # 2.5 startup peaked at 1.03 GiB with two task workers and the /app/data tmpfs.
          memory: 2G
    environment:
      # https://github.com/a1ex4/ownfoil#docker-compose
      - HOME=/tmp
      - USER_ADMIN_NAME=${HINOX_ADMIN_USER}
      - USER_ADMIN_PASSWORD=${HINOX_ADMIN_PASSWORD}
      - USER_GUEST_NAME=${HINOX_USER}
      - USER_GUEST_PASSWORD=${HINOX_PASSWORD}
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "ownfoil_config"

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://hnx.${DOMAIN}/site.webmanifest
      probe.idp_url: https://hnx.${DOMAIN}/

      traefik.enable: true
      traefik.docker.network: proxy

      traefik.http.routers.ownfoil-http.rule: Host(`hnx.${DOMAIN}`)
      traefik.http.routers.ownfoil-http.entrypoints: http
      traefik.http.routers.ownfoil-http.middlewares: redirect-https

      # The web UI is Protected: crowdsec-bouncer, then the IdP as a gate in front of Ownfoil's
      # own login (ADR 0006). Ownfoil has no OIDC or identity-header support (a1ex4/ownfoil#86).
      traefik.http.routers.ownfoil-https.rule: Host(`hnx.${DOMAIN}`)
      traefik.http.routers.ownfoil-https.entrypoints: https
      traefik.http.routers.ownfoil-https.tls: true
      traefik.http.routers.ownfoil-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.ownfoil-https.service: ownfoil
      traefik.http.routers.ownfoil-https.middlewares: protected

      # The Probe's path, without the IdP: a static manifest with no auth and no data
      traefik.http.routers.ownfoil-health.rule: Host(`hnx.${DOMAIN}`) && Path(`/site.webmanifest`)
      traefik.http.routers.ownfoil-health.entrypoints: https
      traefik.http.routers.ownfoil-health.tls: true
      traefik.http.routers.ownfoil-health.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.ownfoil-health.service: ownfoil
      traefik.http.routers.ownfoil-health.middlewares: crowdsec-bouncer,strip-idp-headers

      # Client Path (GLOSSARY.md): Switch shop clients (Tinfoil, Sphaira) share the UI's paths but
      # always send Basic auth, so match the header; Ownfoil checks the credentials (#503).
      traefik.http.routers.ownfoil-client-switch.rule: Host(`hnx.${DOMAIN}`) && HeaderRegexp(`Authorization`, `^Basic `)
      traefik.http.routers.ownfoil-client-switch.priority: 100
      traefik.http.routers.ownfoil-client-switch.entrypoints: https
      traefik.http.routers.ownfoil-client-switch.tls: true
      traefik.http.routers.ownfoil-client-switch.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.ownfoil-client-switch.service: ownfoil
      traefik.http.routers.ownfoil-client-switch.middlewares: crowdsec-bouncer,strip-idp-headers,client-ratelimit

      traefik.http.services.ownfoil.loadbalancer.server.port: 8465
    volumes:
      - ${ZFS_POOL_ROOT_HDD}/roms/hinox:/games
      - ${ZFS_POOL_ROOT_HDD}/roms/hinox/static/NX-OFW1901-Atmos191-060925.zip:/app/static/NX-OFW1901-Atmos191-060925.zip:ro
      - ownfoil_config:/app/config
    networks:
      - default
      - proxy

volumes:
  # Created by the asot-media Stack; the explicit name keeps them across the move.
  ownfoil_config:
    name: asot-media_ownfoil_config
    external: true

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
