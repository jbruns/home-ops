# OWNFOIL STACK (deployed by doco-cd). Moved from a sibling deployment repo (#457).
# Hostnames are under this Stack's own DOMAIN, not edge's.
services:
  ownfoil:
    # https://github.com/a1ex4/ownfoil/releases ; Switch clients use its basic auth on / (#503)
    extends:
      file: ../_baseline.yaml
      service: baseline
    image: a1ex4/ownfoil:2.5.0@sha256:123130aad6a260b1eeacf3968b6b56fbf510662034faab2f4cd2da08d967f3f7
    container_name: ownfoil
    # run.sh only adds a user, chowns /app and sudo's to PUID; start the app as that user instead,
    # so no caps. /app/data (TitleDB, rebuilt at start) was chowned by run.sh; it is a tmpfs now,
    # except its eShop image cache in data/media, which outgrew it and lives on ownfoil_media.
    user: ${OWNFOIL_UID}:${MEDIA_SHARED_GID}
    # Reads the Games Library's switch/ through group gaming (host/truenas/identities.yaml).
    group_add:
      - ${GAMING_GID}
    entrypoint: ["python", "/app/run.py"]
    tmpfs:
      - /app/data:uid=${OWNFOIL_UID},gid=${MEDIA_SHARED_GID},mode=0755,size=384m
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8465/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    deploy:
      resources:
        limits:
          # 2.5 startup peaked at 1.03 GiB with two task workers and the /app/data tmpfs.
          memory: 2G
    environment:
      # https://github.com/a1ex4/ownfoil#docker-compose
      - HOME=/tmp
      - USER_ADMIN_NAME=${HINOX_ADMIN_USER}
      - USER_ADMIN_PASSWORD=${HINOX_ADMIN_PASSWORD}
      - USER_GUEST_NAME=${HINOX_USER}
      - USER_GUEST_PASSWORD=${HINOX_PASSWORD}
    labels:
      # Alert Tier (GLOSSARY.md): critical | warning | info
      tier: warning
      startup-order: "2"
      stack-back.volumes: true
      stack-back.volumes.include: "ownfoil_config"

      # Probe (GLOSSARY.md): the public path a user takes; see prometheus.yml
      probe.url: https://hnx.${DOMAIN}/login

      traefik.enable: true
      traefik.docker.network: proxy

      traefik.http.routers.ownfoil-http.rule: Host(`hnx.${DOMAIN}`)
      traefik.http.routers.ownfoil-http.entrypoints: http
      traefik.http.routers.ownfoil-http.middlewares: redirect-https

      traefik.http.routers.ownfoil-https.rule: Host(`hnx.${DOMAIN}`)
      traefik.http.routers.ownfoil-https.entrypoints: https
      traefik.http.routers.ownfoil-https.tls: true
      traefik.http.routers.ownfoil-https.tls.certresolver: ${CERT_RESOLVER}
      traefik.http.routers.ownfoil-https.service: ownfoil
      traefik.http.routers.ownfoil-https.middlewares: crowdsec-bouncer

      traefik.http.services.ownfoil.loadbalancer.server.port: 8465
    volumes:
      # Media Server (ADR 0009): reads the Switch titles read-only at the same path as before (no
      # rescan); its organizer, dedup, compression and update deletion are off, so it never writes there.
      - type: bind
        source: ${ZFS_POOL_ROOT_HDD}/games/switch
        target: /games
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ZFS_POOL_ROOT_HDD}/games/switch/static/NX-OFW1901-Atmos191-060925.zip
        target: /app/static/NX-OFW1901-Atmos191-060925.zip
        read_only: true
        bind:
          create_host_path: false
      - ownfoil_config:/app/config
      - ownfoil_media:/app/data/media
    networks:
      - default
      - proxy

volumes:
  # Created by the asot-media Stack; the explicit name keeps them across the move.
  ownfoil_config:
    name: ownfoil_config
    external: true
  # Its contents are regenerable (eShop images, fetched again on demand), but the image doesn't
  # create the mount point with ownfoil's owner, so the volume is created and chowned once.
  ownfoil_media:
    name: ownfoil_media
    external: true

networks:
  # Traefik and the Exposed Services it routes to; owned by the edge Stack.
  proxy:
    name: proxy
    external: true
