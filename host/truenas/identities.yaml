# Identities: users and groups other than TrueNAS's built-ins and the media identities in ../identities.tsv.
# See README.md. Users and groups not listed here, and not in identities.tsv, do not exist.

users:
  operator:
    purpose: The Operator's own login, for SMB, SSH and the UI.
    uid: 1000
    group: operator
    groups: [smbadmins, media, backups, roms, software, retrobox, retronas, builtin_administrators, builtin_users]
    home: /mnt/andromeda/home/<operator>
    shell: /usr/bin/zsh
    smb: true
    ssh_key: true
  homeops-agent:
    purpose: The agent's login, for hops and midclt over SSH (ADR 0015).
    uid: 3000
    group: homeops-agent
    groups: [homeops-api]
    home: /mnt/andromeda/home/homeops-agent
    shell: /usr/bin/bash
    smb: false
    password_disabled: true
    ssh_key: true
    sudo_nopasswd: [/usr/bin/docker, /usr/bin/midclt]
  hassio:
    purpose: Home Assistant logs in as this to write its Device Backups over SMB, and can reach no other device's.
    uid: 1010
    group: hassio
    groups: [devices, builtin_users]
    home: /var/empty
    shell: /usr/sbin/nologin
    smb: true
  harpi-nodered:
    purpose: The Node-RED Pi logs in as this to write its Device Backups over SMB, and can reach no other device's.
    uid: 1011
    group: harpi-nodered
    groups: [devices, builtin_users]
    home: /var/empty
    shell: /usr/sbin/nologin
    smb: true
  eisy:
    purpose: The Operator, saving eisy backups by hand, logs in as this to write its Device Backups over SMB, and can reach no other device's.
    uid: 1012
    group: eisy
    groups: [devices, builtin_users]
    home: /var/empty
    shell: /usr/sbin/nologin
    smb: true
  retrobox:
    purpose: A gaming appliance reads ROMs over SMB; replaced by the read-only games user in #731.
    uid: 1002
    group: retrobox
    groups: [roms, builtin_users]
    home: /mnt/andromeda/home/retrobox/retrobox
    shell: /usr/sbin/nologin
    smb: true
  retronas:
    purpose: Owns the retronas dataset; the relay's NFS writes map to it from #730.
    uid: 3256
    group: retronas
    groups: []
    home: /mnt/andromeda/retronas
    shell: /usr/sbin/nologin
    smb: false
    password_disabled: true

groups:
  operator:
    purpose: The Operator's primary group.
    gid: 1001
  smbadmins:
    purpose: SMB administrators (smb admin_group); the Operator only.
    gid: 1000
    members: [operator]
  backups:
    purpose: Group of the Device Backup datasets, so the Operator can read every device's backups; never a device's login.
    gid: 1003
    members: [operator]
  roms:
    purpose: Group of the ROM trees; replaced by the Games Library's groups in #731.
    gid: 1004
    members: [operator, retrobox]
  software:
    purpose: Group of the software dataset.
    gid: 1005
    members: [operator]
  retrobox:
    purpose: retrobox's primary group; removed with the user in #731.
    gid: 1006
    members: [operator, retrobox]
  retronas:
    purpose: Group of the retronas dataset.
    gid: 3000
    members: [operator, retronas]
  hassio:
    purpose: hassio's primary group.
    gid: 1010
  harpi-nodered:
    purpose: harpi-nodered's primary group.
    gid: 1011
  eisy:
    purpose: eisy's primary group.
    gid: 1012
  devices:
    purpose: Every login that writes Device Backups; denied on every share except its own.
    gid: 1013
    members: [hassio, harpi-nodered, eisy]
  homeops-agent:
    purpose: The agent's primary group.
    gid: 3001
  homeops-api:
    purpose: Holds the agent's TrueNAS API key (hops), with READONLY_ADMIN, SNAPSHOT_WRITE and SNAPSHOT_DELETE.
    gid: 3002
    members: [homeops-agent]

api_keys:
  hops-homeops-agent:
    purpose: hops' reads and Rollback Snapshots.
    user: homeops-agent
    expires: never
