# Sharing: SMB and NFS service settings, SMB shares and NFS exports. See README.md.
# Shares not listed here do not exist. Devices are roles in identifiers.sops.yaml.

smb:
  purpose: File access for the Operator's computers and for devices that write Device Backups (one login and share per device).
  bindip: [{address: host-v4}, {address: host-v6}]
  enable_smb1: false  # SMB1 clients are served by the retronas relay on another host
  ntlmv1_auth: false
  aapl_extensions: false
  multichannel: false
  encryption: DEFAULT
  admin_group: smbadmins

nfs:
  purpose: The retronas relay's mount, and (until #731) client access to the ROM trees.
  bindip: [{address: host-v4}]
  protocols: [NFSV3, NFSV4]  # NFSV4 only once #731 removes the ROM tree exports; the relay mounts with NFSv4
  servers: 32
  allow_nonroot: false  # no `insecure`: clients must use a reserved source port, as the relay's kernel client does
  userd_manage_gids: false

smb_shares:
  private:
    purpose: The Operator's own files.
    path: /mnt/andromeda/private
    share_acl: [operator]  # no other login can open it
  software:
    purpose: Installers and OS images for the Operator's computers.
    path: /mnt/andromeda/software
    share_acl: [operator]  # no other login can open it
  hassio-backups:
    purpose: Home Assistant writes its Device Backups here.
    path: /mnt/andromeda/backups/hassio
    share_acl: [hassio]  # no other login can open it
    audit: {watch_list: [hassio]}  # TrueNAS needs a list; the device is the only login that can open it
  harpi-nodered-backups:
    purpose: The Node-RED Pi writes its Device Backups here.
    path: /mnt/andromeda/backups/harpi-nodered
    share_acl: [harpi-nodered]  # no other login can open it
    audit: {watch_list: [harpi-nodered]}  # TrueNAS needs a list; the device is the only login that can open it
  eisy-backups:
    purpose: The Operator, from eisy's Admin Console, writes its Device Backups here.
    path: /mnt/andromeda/backups/eisy
    share_acl: [eisy]  # no other login can open it
    audit: {watch_list: [eisy]}  # TrueNAS needs a list; the device is the only login that can open it
  retronas:
    purpose: The Operator adds retro PC software through their own login, a member of group retronas.
    path: /mnt/andromeda/retronas
    share_acl: [operator]  # the relay uses NFS, so no other login needs it
  roms:
    purpose: Raw ROM copies; reorganized into the Games Library by #731.
    path: /mnt/andromeda/roms
    share_acl: [deny devices, everyone]  # no device login can open it
  emulation:
    purpose: The curated ES-DE tree for gaming appliances; moved into the Games Library by #731.
    path: /mnt/andromeda/emulation
    share_acl: [deny devices, everyone]  # no device login can open it
    share_purpose: MULTIPROTOCOL_SHARE
  games:
    purpose: The Operator curates the Games Library; gaming appliances read library/ and switch/ as gaming.
    path: /mnt/andromeda/games
    share_acl: [operator, gaming read]  # gaming gets READ; file permissions keep it out of verified/
  tv-ingest:
    purpose: Ingest Folder for TV episodes added by hand.
    path: /mnt/andromeda/media/tv/ingest
    share_acl: [operator]
  movies-ingest:
    purpose: Ingest Folder for movies added by hand.
    path: /mnt/andromeda/media/movies/ingest
    share_acl: [operator]
  books-ingest:
    purpose: Ingest Folder for books added by hand.
    path: /mnt/andromeda/media/books/ingest
    share_acl: [operator]

# Every share above has share_purpose DEFAULT_SHARE, browsable, read-write, no hostsallow and no audit unless it says
# otherwise. Its share_acl lists entries in order; `deny devices, everyone` denies the devices group, then allows every
# other login (access comes from file permissions).

nfs_exports:
  retronas:
    purpose: The retronas relay mounts this (NFSv4, read-write) and re-serves it to the retro network; no other host can mount it.
    path: /mnt/andromeda/retronas
    hosts: [{address: retronas-relay}]
    mapall: retronas:retronas  # every user on the relay, root included, writes as retronas
  emulation:
    purpose: Gaming appliances that can't use SMB; open to any host, removed by #731.
    path: /mnt/andromeda/emulation
    hosts: []
  roms:
    purpose: Gaming appliances that can't use SMB; open to any host, removed by #731.
    path: /mnt/andromeda/roms
    hosts: []
