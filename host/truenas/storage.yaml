# Storage: pools, datasets, Periodic Snapshot tasks, scrubs and disk power settings. See README.md.
# Datasets inherit compression, atime, acltype and aclmode from their pool's root dataset unless they list them.
# `permissions` is the dataset's top directory, as `mode owner:group`, plus any ACL beyond the mode.
# Datasets carry no user properties. The system dataset is on andromeda, and only its active children exist.

pools:
  andromeda:
    purpose: Bulk storage for media, Games, software and Backups.
    layout: 3× RAIDZ2 of 8× 20 TB HDD; SLOG mirror of 2× Optane; 2× 20 TB HDD hot spares
    autotrim: false
    feature_flags: all enabled
  luna:
    purpose: Fast storage for the Docker data-root (the Stacks' volumes) and the Host Key.
    layout: mirror of 2× 3.84 TB NVMe
    autotrim: true
    feature_flags: all enabled
  boot-pool:
    purpose: TrueNAS boot environments.
    layout: mirror of 2× 128 GB SATA SSD
    feature_flags: limited by compatibility=grub2, so GRUB can still boot it; never upgrade beyond that set
    boot_environments: the current release and the previous one only

disks:
  all:
    purpose: Every disk stays spun up, so hot spares are ready at once and HDDs avoid wear from constant load and start cycles.
    hddstandby: ALWAYS ON
    advpowermgmt: DISABLED

datasets:
  andromeda:
    purpose: Pool root; sets the defaults its children inherit. Also holds the roms directory, moved by #731.
    compression: LZ4
    atime: false
    acltype: POSIX
    aclmode: DISCARD
    permissions: 0755 root:root
  andromeda/backups:
    purpose: Parent of one dataset per device that writes Device Backups; not shared itself. The nightly Backup carries each child offsite (tn/ops/device-backups).
    permissions: 0751 root:backups  # others traverse into their own dataset but can't list this one
  andromeda/backups/hassio:
    purpose: Home Assistant's scheduled backups; Home Assistant prunes its own.
    quota: 100 GiB
    permissions: 2750 hassio:backups, default ACL group backups r-x
  andromeda/backups/harpi-nodered:
    purpose: The Node-RED Pi's scheduled backups, from a job on the device.
    quota: 5 GiB
    permissions: 2750 harpi-nodered:backups, default ACL group backups r-x
  andromeda/backups/eisy:
    purpose: eisy backups, saved by hand from its Admin Console (it has no scheduler).
    quota: 1 GiB
    permissions: 2750 eisy:backups, default ACL group backups r-x
  andromeda/docker-backups:
    purpose: none; the retired local restic repository, destroyed by #705.
    permissions: 0770 root:root
  andromeda/emulation:
    purpose: The curated, ready-to-play ES-DE tree; moved into the Games Library by #731.
    acltype: NFSV4
    aclmode: PASSTHROUGH
    permissions: 0775 operator:roms, NFSv4 ACL (owner@ full, group@ modify, everyone@ read)
  andromeda/home:
    purpose: Home directories; narrowed to the Operator and the agent by #729.
    aclmode: DISCARD
    permissions: 0755 root:root
  andromeda/home/retrobox:
    purpose: none; removed by #729.
    permissions: 0775 retrobox:roms, ACL grants root user and group rwx
  andromeda/media:
    purpose: Libraries and the media pipeline's working folders (ADR 0009).
    recordsize: 1M
    permissions: 2550 media:media
  andromeda/misc:
    purpose: none; its contents move to andromeda/private and it is retired by #729.
    permissions: 0775 operator:operator, ACL
  andromeda/retronas:
    purpose: Software for retro PCs, relayed to SMB1 clients by another host; reworked by #730.
    permissions: 0775 retronas:retronas
  andromeda/software:
    purpose: Installers, OS images and deployment media.
    permissions: 0775 operator:software
  luna:
    purpose: Pool root; holds the Host Key and startup-order script (/mnt/luna/homeops) and the Docker data-root.
    compression: LZ4
    atime: false
    acltype: POSIX
    aclmode: DISCARD
    permissions: 0755 root:root

periodic_snapshot_tasks:
  luna:
    purpose: Stack volumes restored faster than from B2.
    dataset: luna
    recursive: true
    schedule: 23:00 Mon–Sat
    lifetime: 1 WEEK
    naming_schema: luna-%Y-%m-%d_%H-%M
    allow_empty: true
  software:
    purpose: Restores files deleted or encrypted over SMB; listed as Previous Versions.
    dataset: andromeda/software
    recursive: false
    schedule: 00:30 daily
    lifetime: 14 DAY
    naming_schema: software-%Y-%m-%d_%H-%M
    allow_empty: true
  retronas:
    purpose: Restores files deleted or encrypted over SMB or by the retronas relay; listed as Previous Versions.
    dataset: andromeda/retronas
    recursive: false
    schedule: 00:30 daily
    lifetime: 14 DAY
    naming_schema: retronas-%Y-%m-%d_%H-%M
    allow_empty: true
  emulation:
    purpose: Restores files deleted or encrypted over SMB or NFS; listed as Previous Versions. Replaced by #731.
    dataset: andromeda/emulation
    recursive: false
    schedule: 00:30 daily
    lifetime: 14 DAY
    naming_schema: emulation-%Y-%m-%d_%H-%M
    allow_empty: true
  misc:
    purpose: Restores files deleted or encrypted over SMB until #729 retires the dataset.
    dataset: andromeda/misc
    recursive: false
    schedule: 00:30 daily
    lifetime: 14 DAY
    naming_schema: misc-%Y-%m-%d_%H-%M
    allow_empty: true
  backups:
    purpose: Restores Device Backups wiped by a compromised device, if noticed within 30 days; listed as Previous Versions. A device can delete its files, not its snapshots.
    dataset: andromeda/backups
    recursive: true
    schedule: 00:30 daily
    lifetime: 30 DAY
    naming_schema: backups-%Y-%m-%d_%H-%M
    allow_empty: true

scrubs:
  andromeda:
    purpose: Finds and repairs silent corruption before a second failure can make it permanent.
    schedule: 00:00 Sunday
    threshold_days: 35
  luna:
    purpose: Finds and repairs silent corruption before a second failure can make it permanent.
    schedule: 00:00 Sunday
    threshold_days: 35
