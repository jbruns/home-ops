# Storage: pools, datasets, Periodic Snapshot tasks, scrubs and disks outside pools. See README.md.
# Datasets inherit compression, atime, acltype and aclmode from their pool's root dataset unless they list them.
# `permissions` is the dataset's top directory, as `mode owner:group`, plus any ACL beyond the mode.

pools:
  andromeda:
    purpose: Bulk storage for media, Games, software and Backups.
    layout: 3× RAIDZ2 of 8× 20 TB HDD; SLOG mirror of 2× Optane
    autotrim: false
    feature_flags: not all enabled; upgraded by #725
  luna:
    purpose: Fast storage for the Docker data-root (the Stacks' volumes) and the Host Key.
    layout: mirror of 2× 3.84 TB NVMe
    autotrim: true
    feature_flags: not all enabled; upgraded by #725
  boot-pool:
    purpose: TrueNAS boot environments.
    layout: mirror of 2× 128 GB SATA SSD

disks_outside_pools:
  spare-hdds:
    purpose: Two 20 TB HDDs matching andromeda's, kept as cold spares; added as hot spares by #726.
    count: 2

datasets:
  andromeda:
    purpose: Pool root; sets the defaults its children inherit. Also holds the roms directory, moved by #731.
    compression: LZ4
    atime: false
    acltype: POSIX
    aclmode: DISCARD
    permissions: 0755 root:root
  andromeda/backups:
    purpose: Device Backups written by other devices on the network; restructured by #728.
    permissions: 0755 root:backups
    user_properties: [managedby]  # removed by #723
  andromeda/docker-backups:
    purpose: none; the retired local restic repository, destroyed by #705.
    permissions: 0770 root:root
    user_properties: [comments, managedby]  # removed by #723
  andromeda/emulation:
    purpose: The curated, ready-to-play ES-DE tree; moved into the Games Library by #731.
    acltype: NFSV4
    aclmode: PASSTHROUGH
    permissions: 0775 operator:roms, NFSv4 ACL (owner@ full, group@ modify, everyone@ read)
    user_properties: [comments, managedby]  # removed by #723
  andromeda/home:
    purpose: Home directories; narrowed to the Operator and the agent by #729.
    aclmode: DISCARD
    permissions: 0755 root:root
    user_properties: [managedby]  # removed by #723
  andromeda/home/retrobox:
    purpose: none; removed by #729.
    permissions: 0775 retrobox:roms, ACL grants root user and group rwx
    user_properties: [managedby]  # removed by #723
  andromeda/media:
    purpose: Libraries and the media pipeline's working folders (ADR 0009).
    recordsize: 1M
    permissions: 2550 media:media
    user_properties: [managedby]  # removed by #723
  andromeda/misc:
    purpose: none; its contents move to andromeda/private and it is retired by #729.
    permissions: 0775 operator:operator, ACL
    user_properties: [managedby]  # removed by #723
  andromeda/retronas:
    purpose: Software for retro PCs, relayed to SMB1 clients by another host; reworked by #730.
    permissions: 0775 retronas:retronas
    user_properties: [managedby]  # removed by #723
  andromeda/scratch:
    purpose: none; empty, removed by #723.
    permissions: 0755 operator:operator
    user_properties: [managedby]  # removed by #723
  andromeda/software:
    purpose: Installers, OS images and deployment media.
    permissions: 0775 operator:software; some folders group builtin_users, narrowed by #723
    user_properties: [managedby]  # removed by #723
  luna:
    purpose: Pool root; holds the Host Key and startup-order script (/mnt/luna/homeops) and the Docker data-root.
    compression: LZ4
    atime: false
    acltype: POSIX
    aclmode: DISCARD
    permissions: 0755 root:root

periodic_snapshot_tasks:
  luna:
    purpose: Stack volumes restored faster than from B2.
    dataset: luna
    recursive: true
    schedule: 23:00 Mon–Sat
    lifetime: 1 WEEK
    naming_schema: luna-%Y-%m-%d_%H-%M
    allow_empty: true

scrubs:
  andromeda:
    purpose: Finds and repairs silent corruption before a second failure can make it permanent.
    schedule: 00:00 Sunday
    threshold_days: 35
  luna:
    purpose: Finds and repairs silent corruption before a second failure can make it permanent.
    schedule: 00:00 Sunday
    threshold_days: 35
