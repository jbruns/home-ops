# Services: which TrueNAS services run, and their settings. See README.md.
# Services not listed here (FTP, iSCSI, NVMe-oF, SNMP, UPS) are disabled, with no leftover configuration.

services:
  cifs:
    purpose: SMB shares (sharing.yaml).
    enable: true
  nfs:
    purpose: NFS exports (sharing.yaml).
    enable: true
  ssh:
    purpose: The agent's access (hops, midclt) and the Operator's shell.
    enable: true

ssh:
  purpose: Key logins for the agent and the Operator, and password logins for the Operator.
  tcpport: 22
  passwordauth: true
  password_login_groups: [operator]  # the Operator only; the Host is on a private LAN
  tcpfwd: false  # hops tunnels over stdin, not forwarding
  weak_ciphers: []
  # root has no password and no SSH key, so it cannot log in over SSH.

two_factor:
  purpose: not used; logins are by SSH key or the UI behind the LAN.
  enabled: false

audit:
  purpose: Middleware, SMB and sudo audit events, kept for 7 days.
  retention: 7
