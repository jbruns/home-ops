# Storage: the Proxmox Host's storage definitions (`storage`). See README.md.
# Two disks back them: the boot disk (LVM volume group `pve`) and a SATA SSD pool (ZFS pool `pve-zfs-satassd`).
# `truenas-backup` is the Proxmox Host's Device Backup share on the TrueNAS Host (ADR 0019); the retronas export
# comes with #760.

local:
  purpose: Proxmox VE's default directory on the boot disk; no Kept Guest disk is on it.
  type: dir
  path: /var/lib/vz
  content: [snippets, vztmpl, iso, images, rootdir, backup]
  prune-backups: keep-all=1
local-lvm:
  purpose: Thin pool on the boot disk for Guest disks; holds both Kept Guests' system disks. Supports Guest snapshots.
  type: lvmthin
  vgname: pve
  thinpool: data
  content: [images, rootdir]
vmdata-sata:
  purpose: ZFS dataset on the SATA SSD pool for Guest disks; holds the Windows Server 2003 VM's second disk. Supports Guest snapshots.
  type: zfspool
  pool: pve-zfs-satassd/vmdata
  sparse: true
  content: [images, rootdir]
sources:
  purpose: Installer ISOs, container templates and snippets, on the SATA SSD pool.
  type: dir
  path: /pve-zfs-satassd/sources
  content: [snippets, vztmpl, iso]
dump:
  purpose: Local vzdump target on the SATA SSD pool; empty, as the backup job writes to truenas-backup.
  type: dir
  path: /pve-zfs-satassd/dump
  content: [backup]
truenas-backup:
  purpose: The Proxmox Host's Device Backup share on the TrueNAS Host, which the weekly vzdump job writes to; the nightly Backup carries it offsite.
  type: cifs
  server: {address: host-v4}  # the TrueNAS Host's address, addresses.host-v4 in ../truenas/identifiers.sops.yaml
  share: proxmox-backups  # ../truenas/sharing.yaml
  username: proxmox  # its password is passwords.proxmox in ../truenas/device-logins.sops.yaml; Proxmox VE keeps it in /etc/pve/priv/storage/truenas-backup.pw
  content: [backup]
