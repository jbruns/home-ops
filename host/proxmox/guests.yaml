# Kept Guests: one top-level key per Guest, each declared and backed up (ADR 0019). See README.md.
# hops reads `vmid` and `type` (Kept or Stray, in `hops host`/`hops strays --host proxmox`); the rest is the record.
# A Guest not listed here exists only with the `scratch` tag. Names hold the domain as `<domain>`; addresses are
# roles, whose values are not recorded in this repo yet. Sizes are the disks' provisioned sizes.

dc:
  purpose: The Windows Server 2003 VM, the retro domain's server (AD, DNS and WINS, and WDS network installs), the nameserver for everything on the retro network. DHCP comes from the retro network's router, on another machine.
  vmid: 105
  type: qemu
  name: dc.retro.<domain>
  ostype: wxp  # Proxmox VE's type for Windows XP and Server 2003
  machine: pc-i440fx-9.0
  cpu: x86-64-v2-AES
  sockets: 1
  cores: 1
  memory: 2048  # MiB
  balloon: 0  # no balloon driver for Server 2003
  disks:
    ide0: {storage: local-lvm, size: 64 GiB}  # system disk
    ide3: {storage: vmdata-sata, size: 136 GiB}
  ide2: none,media=cdrom  # empty drive for installer ISOs from `sources`
  boot: order=ide0;ide2
  network:
    net0: {model: virtio, bridge: vmbr0, tag: 50}  # retro network only
  onboot: false  # starts only when the Operator starts it

rnas:
  purpose: The RetroNAS relay, serving the TrueNAS Host's retronas export to retro PCs over their old protocols; the only Guest on both the retro network and the main LAN, firewalled from the main LAN (network.yaml).
  vmid: 102
  type: lxc
  hostname: rnas.retro.<domain>  # 101's name, so the retro domain's DNS and WINS records still point here
  ostype: debian
  arch: amd64
  template: sources:vztmpl/debian-13-standard_13.6-1_amd64.tar.zst  # what it was created from
  unprivileged: true
  features: {nesting: 1}  # systemd in Debian 13 needs it; no `mount`, so the relay can't mount NFS or SMB itself
  tags: [retro]
  cores: 2
  memory: 2048  # MiB
  swap: 512  # MiB
  rootfs: {storage: local-lvm, size: 32 GiB, mountoptions: noatime}  # the files live on the TrueNAS Host; this holds the OS and RetroNAS
  mounts:
    mp0: {source: /mnt/pve/retronas, mp: /data/retronas}  # bind mount of the retronas storage (storage.yaml) at RetroNAS's retronas_path; vzdump and snapshots leave it out
  hookscript: local:snippets/retronas-relay-mount.sh  # source: snippets/retronas-relay-mount.sh; pre-start refuses unless the export is mounted
  idmap:  # lxc.idmap: uid 3256 and gid 3000 (retronas) pass straight through, so the export's files keep their owner; the rest maps to 100000 up
    - u 0 100000 3256
    - u 3256 3256 1
    - u 3257 103257 62279
    - g 0 100000 3000
    - g 3000 3000 1
    - g 3001 103001 62535
  subids: {subuid: 'root:3256:1', subgid: 'root:3000:1'}  # the Proxmox Host's /etc/subuid and /etc/subgid allow root those two IDs, beside root:100000:65536
  users:
    retronas: {uid: 3256, gid: 3000}  # the same IDs as the TrueNAS Host's retronas user and group (../truenas/identities.yaml)
  retronas:
    retronas_path: /data/retronas  # RetroNAS's default, in /opt/retronas/ansible/retronas_vars.yml
    playbooks: run only with mp0 detached  # they chmod retronas_path and its config/ to 2775 (hard-coded); ../truenas/storage.yaml keeps the dataset at 2770
    services: [samba]  # SMB1 and NetBIOS (smbd, nmbd) only; no Cockpit or other installer. The firewall (network.yaml) opens only these, to the retro network
  access: console only  # `pct enter 102` on the Proxmox Host; openssh-server is purged, root has no key and a locked password, and the firewall drops tcp 22
  sysctl: {net.ipv4.ip_forward: 0, net.ipv6.conf.all.disable_ipv6: 1, net.ipv6.conf.default.disable_ipv6: 1}  # /etc/sysctl.d/90-relay.conf: no forwarding, no IPv6 (the retro network has none). The firewall's ipfilter and IPv4-only rules hold even if root in the relay changes them
  network:
    net0: {name: eth0, bridge: vmbr0, tag: 50, ip: {address: relay-retro-v4}, gw: {address: retro-gateway-v4}, hwaddr: 101's net0, firewall: 1}  # retro network; also its way to the internet for updates
    net1: {name: eth1, bridge: vmbr0, ip: {address: relay-lan-v4}, hwaddr: 101's net1, firewall: 1}  # main LAN; keeps 101's address, but the firewall lets nothing in or out on it
  nameserver: {address: dc-retro-v4}  # the Windows Server 2003 VM (105)
  searchdomain: retro.<domain>
  onboot: false  # starts only when the Operator starts it

rnas-101:
  purpose: none; the old, privileged RetroNAS relay, kept stopped for 2 weeks after the cutover to 102 (its first start), then destroyed by #760.
  vmid: 101
  type: lxc
  hostname: rnas.retro.<domain>
  ostype: debian
  arch: amd64
  unprivileged: false  # no idmap; the config sets no `unprivileged`
  features: {mount: nfs;cifs, nesting: 1}  # it mounts the retronas export itself
  tags: [retro]
  cores: 2
  memory: 2048  # MiB
  swap: 2048  # MiB
  rootfs: {storage: local-lvm, size: 256 GiB, mountoptions: noatime}
  network:
    net0: {name: eth0, bridge: vmbr0, tag: 50, ip: {address: relay-retro-v4}, gw: {address: retro-gateway-v4}}  # retro network; 102 took over its address and MAC
    net1: {name: eth1, bridge: vmbr0, ip: {address: relay-lan-v4}}  # main LAN; 102 took over its address and MAC
  nameserver: {address: dc-retro-v4}  # the Windows Server 2003 VM (105)
  searchdomain: retro.<domain>
  onboot: false  # never start it while 102 runs: they share addresses and MACs
