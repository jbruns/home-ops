name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

# Shared Repo Tooling (ADR 0012): reusable workflows from the Repo Tooling repo, each installing its tools from
# its own commit. Renovate bumps them together (repo-ci-vX.Y.Z).
jobs:
  tool-tests:
    name: tool tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m pip install --quiet --requirement tools/requirements-test.txt
      - run: python3 -m pytest tools host

  # Every input as an explicit --path, so a moved or missing component fails instead of being skipped, and every
  # privacy allowlist pattern as a --privacy-allow.
  validate-paths:
    name: validate paths
    runs-on: ubuntu-24.04
    outputs:
      args: ${{ steps.paths.outputs.args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tools/validate/paths
            tools/validate/privacy-allow
            tools/validate/validate_paths.py
          sparse-checkout-cone-mode: false
      # validate_paths.py refuses a malformed line and shell-quotes the rest for repo-validate's shlex.split.
      - id: paths
        run: |
          args=$(python3 tools/validate/validate_paths.py)
          echo "args=$args" >> "$GITHUB_OUTPUT"

  repo:
    name: secrets, env, compose, cloudflare, isolation, privacy
    needs: validate-paths
    uses: jbruns/homelab-components/.github/workflows/repo-validate.yaml@b59b24fbb343d5838f90eb8abd7f943488e0846c # repo-ci-v1.1.0
    with:
      checks: secrets env compose cloudflare isolation privacy
      extra-args: ${{ needs.validate-paths.outputs.args }}
      # Prose names roles, never repositories, people, logins or hostnames (ADR 0013); the denylist stays a secret.
      privacy-mode: fail
    secrets:
      privacy-denylist: ${{ secrets.PRIVACY_DENYLIST }}

  monitoring:
    name: monitoring configs, rules, dashboards, Grafana
    needs: validate-paths
    uses: jbruns/homelab-components/.github/workflows/repo-validate.yaml@b59b24fbb343d5838f90eb8abd7f943488e0846c # repo-ci-v1.1.0
    with:
      checks: monitoring
      timeout-minutes: 10
      extra-args: ${{ needs.validate-paths.outputs.args }}

  declared-containers:
    name: declared containers
    uses: jbruns/homelab-components/.github/workflows/repo-declared-containers.yaml@b59b24fbb343d5838f90eb8abd7f943488e0846c # repo-ci-v1.1.0

  gitleaks:
    name: gitleaks
    uses: jbruns/homelab-components/.github/workflows/repo-gitleaks.yaml@b59b24fbb343d5838f90eb8abd7f943488e0846c # repo-ci-v1.1.0

  tooling:
    name: renovate config, actionlint
    uses: jbruns/homelab-components/.github/workflows/repo-lint.yaml@b59b24fbb343d5838f90eb8abd7f943488e0846c # repo-ci-v1.1.0

  # Single required check for branch protection.
  validate:
    name: validate
    if: always()
    needs: [validate-paths, repo, monitoring, declared-containers, gitleaks, tooling, tool-tests]
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all checks passed"
