name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

# Shared Repo Tooling (ADR 0012): reusable workflows from jbruns/homelab-components, each installing its tools from
# its own commit. Renovate bumps them together (repo-ci-vX.Y.Z).
jobs:
  tool-tests:
    name: tool tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m pip install --quiet --requirement tools/requirements-test.txt
      - run: python3 -m pytest tools host

  repo:
    name: secrets, env, compose, cloudflare, isolation
    uses: jbruns/homelab-components/.github/workflows/repo-validate.yaml@277615d9bf8552644cd1fc3e0e48416e2f3709bb # repo-ci-v1.0.0
    with:
      checks: secrets env compose cloudflare isolation

  monitoring:
    name: monitoring configs, rules, dashboards, Grafana
    uses: jbruns/homelab-components/.github/workflows/repo-validate.yaml@277615d9bf8552644cd1fc3e0e48416e2f3709bb # repo-ci-v1.0.0
    with:
      checks: monitoring
      timeout-minutes: 10
      extra-args: --path dashboards=tools/dashboards/dashboards.py --path rule-tests=tools/validate/rules

  declared-containers:
    name: declared containers
    uses: jbruns/homelab-components/.github/workflows/repo-declared-containers.yaml@277615d9bf8552644cd1fc3e0e48416e2f3709bb # repo-ci-v1.0.0

  gitleaks:
    name: gitleaks
    uses: jbruns/homelab-components/.github/workflows/repo-gitleaks.yaml@277615d9bf8552644cd1fc3e0e48416e2f3709bb # repo-ci-v1.0.0

  tooling:
    name: renovate config, actionlint
    uses: jbruns/homelab-components/.github/workflows/repo-lint.yaml@277615d9bf8552644cd1fc3e0e48416e2f3709bb # repo-ci-v1.0.0

  # Single required check for branch protection.
  validate:
    name: validate
    if: always()
    needs: [repo, monitoring, declared-containers, gitleaks, tooling, tool-tests]
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all checks passed"
